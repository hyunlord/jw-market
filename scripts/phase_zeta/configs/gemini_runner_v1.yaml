phase_zeta_runner:
  config_version: "phase_zeta_runner_v1"
  builder_version: "1.0.0"

  llm:
    provider: "vertex_ai"
    project_id: "prj-jw-agn-dev-ai-490605"
    region: "asia-northeast3"
    model_id: "gemini-2.5-flash"
    temperature: 0.1
    top_p: 0.95
    top_k: 40
    max_output_tokens: 8192
    response_mime_type: "application/json"

  auth:
    method: "workload_identity"

  pricing:
    input_per_million_usd: 0.075
    output_per_million_usd: 0.30

  validator:
    tolerance_default: 0.01
    tolerance_percent: 0.05
    tolerance_kpi: 0.05
    cascade_skip_on_fail: false

  composer:
    update_cache_deep_analysis: false
    db_host: "localhost"
    db_port: 3308
    db_user: "root"
    db_name: "jw_mart"

  retry:
    max_attempts: 2
    backoff_sec: 5
