<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JW Chat Agent POC</title>
  <style>
    :root {
      color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --surface-primary: #f6f7f9; --surface-secondary: #ffffff; --surface-elevated: #fbfdff; --text-primary: #18212f; --text-secondary: #667587;
      --border-default: #d9e0ea; --border-subtle: #dde2ea; --accent-primary: #17324d; --accent-hover: #234766; --accent-soft: #e9f0f7;
      --message-user: #eef6f3; --message-user-border: #c8ded8; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-7: 28px;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; min-height: 100dvh; height: 100dvh; overflow: hidden; background: var(--surface-primary); color: var(--text-primary); }
    main { max-width: 980px; min-height: 100dvh; height: 100dvh; margin: 0 auto; padding: var(--space-7) var(--space-7) 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: var(--space-4); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    h1 { font-size: 24px; margin: 0; letter-spacing: 0; }
    .composer { position: sticky; bottom: 0; z-index: 2; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; margin: 0; padding: var(--space-3) 0 var(--space-7); background: linear-gradient(180deg, rgba(246, 247, 249, 0), var(--surface-primary) 24%); }
    input, button { font: inherit; border: 1px solid #c9d0dc; border-radius: 6px; padding: 12px 14px; background: var(--surface-secondary); }
    input:focus, button:focus-visible { outline: 3px solid rgba(23, 50, 77, 0.2); outline-offset: 2px; }
    button { background: var(--accent-primary); color: white; border-color: var(--accent-primary); cursor: pointer; min-width: 96px; transition: background-color 150ms ease-out, transform 150ms ease-out; }
    button:hover { background: var(--accent-hover); }
    button:active { transform: translateY(1px); }
    .chat-panel { min-height: 0; overflow-y: auto; scroll-behavior: smooth; background: var(--surface-secondary); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 18px 18px var(--space-6); }
    #sources { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-3); }
    .tag { background: var(--accent-soft); color: #27415d; border-radius: 999px; padding: 5px 10px; font-size: 13px; }
    #transcript { display: grid; gap: 10px; margin-bottom: 16px; }
    .message { border: 1px solid var(--border-default); border-radius: 8px; padding: 10px 12px; background: var(--surface-elevated); line-height: 1.55; }
    .message.user { justify-self: end; max-width: 78%; background: var(--message-user); border-color: var(--message-user-border); }
    .message.assistant { justify-self: stretch; }
    #answer { line-height: 1.62; font-size: 16px; }
    #charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-top: 18px; }
    .chart-card { border: 1px solid var(--border-default); border-radius: 8px; padding: 14px; background: var(--surface-elevated); } .chart-card h2 { font-size: 16px; margin: 0 0 10px; color: #1c2f44; }
    .chart-wrap { position: relative; height: 280px; } .chart-source { display: block; margin-top: 8px; color: #667587; font-size: 12px; }
    .markdown-body h2 { font-size: 20px; margin: 20px 0 8px; } .markdown-body h3 { font-size: 16px; margin: 18px 0 8px; color: #27415d; }
    .markdown-body p { margin: 0 0 12px; } .markdown-body ul { padding-left: 22px; margin: 8px 0 14px; }
    .markdown-body table { width: 100%; border-collapse: collapse; margin: 10px 0 18px; font-size: 14px; } .markdown-body th, .markdown-body td { border: 1px solid #d9e0ea; padding: 8px 10px; text-align: left; vertical-align: top; }
    .markdown-body th { background: #f1f5f9; color: #1c2f44; } .markdown-body a { color: #0a5cad; text-decoration: none; } .markdown-body a:hover { text-decoration: underline; }
    .markdown-body code { background: #f1f5f9; border-radius: 4px; padding: 1px 5px; } .muted { color: var(--text-secondary); }
    @media (max-width: 640px) {
      main { padding: var(--space-4) var(--space-4) 0; } header { align-items: flex-start; flex-direction: column; gap: var(--space-2); }
      .composer { grid-template-columns: 1fr; padding-bottom: var(--space-4); } button { width: 100%; }
      .message.user { max-width: 92%; } #charts { grid-template-columns: 1fr; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.3/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>JW Chat Agent POC</h1>
      <span class="muted">GCP backend SSE demo</span>
    </header>
    <section class="chat-panel">
      <div id="sources"></div>
      <div id="transcript" aria-live="polite"></div>
      <div id="answer" class="markdown-body muted">질문을 입력하면 스트리밍 답변이 표시됩니다.</div>
      <div id="charts" aria-live="polite"></div>
    </section>
    <form id="chat-form" class="composer">
      <input id="question" value="리바로 시장 규모랑 성장 추이는?" autocomplete="off">
      <button type="submit">질문</button>
    </form>
  </main>
  <script>
    const queryParams = new URLSearchParams(location.search);
    const defaultEndpoint = `${window.location.origin}/jw-chat-agent`;
    const endpoint = (queryParams.get("api") || defaultEndpoint).replace(/\/+$/, "");
    const externalMode = queryParams.get("external_mode") || "live";
    let conversationId = queryParams.get("conversation_id") || sessionStorage.getItem("jwChatConversationId") || "";
    if (!conversationId) {
      conversationId = window.crypto?.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      sessionStorage.setItem("jwChatConversationId", conversationId);
    }
    const form = document.querySelector("#chat-form");
    const input = document.querySelector("#question");
    const answer = document.querySelector("#answer");
    const sources = document.querySelector("#sources");
    const chartsRoot = document.querySelector("#charts");
    const transcript = document.querySelector("#transcript");
    const chatPanel = document.querySelector(".chat-panel");
    let current;
    let streamSequence = 0;
    let rawAnswer = "";
    let chartInstances = [];
    let currentAssistantMessage;

    function renderMarkdownInto(target, markdown) {
      if (!markdown) {
        target.innerHTML = "";
        return;
      }
      if (window.marked && window.DOMPurify) {
        const html = marked.parse(markdown, { breaks: false, gfm: true });
        target.innerHTML = DOMPurify.sanitize(html);
        target.querySelectorAll("a").forEach((link) => {
          link.target = "_blank";
          link.rel = "noopener noreferrer";
        });
      } else {
        target.textContent = markdown;
      }
    }

    function renderActiveAnswer(markdown) {
      if (currentAssistantMessage) {
        renderMarkdownInto(currentAssistantMessage, markdown);
        return;
      }
      renderMarkdownInto(answer, markdown);
    }

    function closeCurrentStream() {
      if (!current) return;
      current.close();
      current = null;
    }

    function isActiveStream(source, streamId) {
      return current === source && streamId === streamSequence;
    }

    function appendMessage(role, text) {
      const node = document.createElement("div");
      node.className = `message ${role}`;
      if (role === "assistant") {
        node.classList.add("markdown-body");
        renderMarkdownInto(node, text);
      } else {
        node.textContent = text;
      }
      transcript.append(node);
      scrollConversationToBottom();
      return node;
    }

    function scrollConversationToBottom() {
      if (!chatPanel) return;
      const prefersReducedMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;
      requestAnimationFrame(() => {
        chatPanel.scrollTo({
          top: chatPanel.scrollHeight,
          behavior: prefersReducedMotion ? "auto" : "smooth",
        });
      });
    }

	    function resetCharts() { chartInstances.forEach((chart) => chart.destroy()); chartInstances = []; chartsRoot.innerHTML = ""; }

    function formatChartValue(value, unit) {
      if (unit === "KRW") return `${Math.round(value / 100000000).toLocaleString("ko-KR")}억원`;
      if (unit === "%") return `${Number(value).toLocaleString("ko-KR")}%`;
      if (unit === "명") return `${Number(value).toLocaleString("ko-KR")}명`;
      return Number(value).toLocaleString("ko-KR");
    }

    function renderCharts(charts) {
      resetCharts();
      if (!Array.isArray(charts) || charts.length === 0) return;
      if (!window.Chart) return;
      charts.forEach((chartSpec) => {
        const card = document.createElement("article");
        card.className = "chart-card";
        const title = document.createElement("h2");
        title.textContent = chartSpec.title || "차트";
        const wrap = document.createElement("div");
        wrap.className = "chart-wrap";
        const canvas = document.createElement("canvas");
        const source = document.createElement("small");
        source.className = "chart-source";
        source.textContent = chartSpec.source ? `출처: ${chartSpec.source}` : "";
        wrap.append(canvas);
        card.append(title, wrap, source);
        chartsRoot.append(card);

        const unit = chartSpec.unit || (chartSpec.datasets?.[0]?.unit ?? "");
        const datasets = (chartSpec.datasets || []).map((dataset, index) => ({
          ...dataset,
          borderColor: dataset.borderColor || ["#0f9f9a", "#2563eb", "#f97316"][index % 3],
          backgroundColor: dataset.backgroundColor || (chartSpec.type === "line" ? "rgba(15, 159, 154, 0.16)" : "#64748b"),
          borderWidth: dataset.borderWidth || 2,
          tension: dataset.tension ?? 0.25,
          fill: dataset.fill ?? false,
        }));
        const config = {
          type: chartSpec.type || "bar",
          data: { labels: chartSpec.labels || [], datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: true, position: "bottom" },
              tooltip: {
                callbacks: {
                  label(context) {
                    const label = context.dataset.label ? `${context.dataset.label}: ` : "";
                    return `${label}${formatChartValue(context.parsed.y ?? context.parsed, context.dataset.unit || unit)}`;
                  },
                },
              },
            },
            scales: chartSpec.type === "doughnut" ? {} : {
              y: {
                ticks: {
                  callback(value) {
                    return formatChartValue(value, unit);
                  },
                },
              },
            },
          },
        };
        chartInstances.push(new Chart(canvas, config));
      });
      scrollConversationToBottom();
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      closeCurrentStream();
      streamSequence += 1;
      const streamId = streamSequence;
      let streamCompleted = false;
      const question = input.value.trim();
      if (!question) return;
      appendMessage("user", question);
      currentAssistantMessage = appendMessage("assistant", "");
      answer.className = "markdown-body";
      rawAnswer = "";
      answer.textContent = "";
      answer.hidden = true;
      resetCharts();
      sources.textContent = "";
      const url = `${endpoint}/chat/stream?external_mode=${encodeURIComponent(externalMode)}&conversation_id=${encodeURIComponent(conversationId)}&question=${encodeURIComponent(question)}`;
      const source = new EventSource(url);
      current = source;
      source.addEventListener("conversation", (event) => {
        if (!isActiveStream(source, streamId)) return;
        if (event.data) {
          conversationId = event.data;
          sessionStorage.setItem("jwChatConversationId", conversationId);
        }
      });
      source.addEventListener("sources", (event) => {
        if (!isActiveStream(source, streamId)) return;
        sources.textContent = "";
        event.data.split(",").filter(Boolean).forEach((item) => {
          const tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = item;
          sources.append(tag);
        });
      });
      const appendMarkdown = (markdown) => {
        rawAnswer += markdown;
        renderActiveAnswer(rawAnswer);
        scrollConversationToBottom();
      };
      source.addEventListener("delta", (event) => {
        if (!isActiveStream(source, streamId) || streamCompleted) return;
        appendMarkdown(event.data);
      });
      source.addEventListener("markdown_block", (event) => {
        if (!isActiveStream(source, streamId) || streamCompleted) return;
        try {
          const payload = JSON.parse(event.data || "{}");
          appendMarkdown(payload.markdown || "");
        } catch {
          appendMarkdown("");
        }
      });
      source.addEventListener("charts", (event) => {
        if (!isActiveStream(source, streamId) || streamCompleted) return;
        try {
          renderCharts(JSON.parse(event.data || "[]"));
        } catch {
          renderCharts([]);
        }
      });
      source.addEventListener("done", () => {
        if (!isActiveStream(source, streamId)) return;
        streamCompleted = true;
        source.close();
        if (current === source) current = null;
      });
      source.onerror = () => {
        if (!isActiveStream(source, streamId)) {
          source.close();
          return;
        }
        source.close();
        if (current === source) current = null;
        if (streamCompleted) return;
        streamCompleted = true;
        rawAnswer += "\n\n연결이 종료되었습니다.";
        renderActiveAnswer(rawAnswer);
      };
    });
  </script>
</body>
</html>
