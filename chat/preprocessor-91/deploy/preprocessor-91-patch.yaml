apiVersion: apps/v1
kind: Deployment
metadata:
  name: preprocessor-91
  namespace: llmops
spec:
  template:
    metadata:
      annotations:
        jw-market/source-sha256: 956a4797072bcc2ee4f9e64c3c6ac22ef9d311783fa7749307ab7dde386828bd
    spec:
      containers:
        - name: preprocessor-91
          env:
            - name: PREPROC_PAGE_WORKERS
              value: "8"
            - name: PREPROC_PAGE_WORKER_THREADS
              value: "1"
            - name: PDF_OCR_LANGUAGES
              value: "eng+kor"
            - name: OCR_TESSERACT_PSM
              value: "4"
            - name: PDF_TEXT_LAYER_MIN_CHARS
              value: "20"
            - name: PREPROC_LARGE_PDF_MIN_PAGES
              value: "50"
            - name: PREPROC_LARGE_PDF_MIN_BYTES
              value: "5242880"
            - name: PREPROC_LARGE_PDF_LOCK_PATH
              value: /tmp/preprocessor-91-large-pdf.lock
          resources:
            requests:
              cpu: "8"
              memory: 16Gi
            limits:
              cpu: "8"
              memory: 16Gi
