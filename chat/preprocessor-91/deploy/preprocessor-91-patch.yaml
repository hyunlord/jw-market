apiVersion: apps/v1
kind: Deployment
metadata:
  name: preprocessor-91
  namespace: llmops
spec:
  template:
    metadata:
      annotations:
        jw-market/source-sha256: f153ae7228efab072e53c26480762df18552719842c7f8e54becb14847597b45
    spec:
      containers:
        - name: preprocessor-91
          env:
            - name: PREPROC_PAGE_WORKERS
              value: "2"
            - name: PREPROC_PAGE_WORKER_THREADS
              value: "2"
            - name: PREPROC_LARGE_PDF_MIN_PAGES
              value: "50"
            - name: PREPROC_LARGE_PDF_MIN_BYTES
              value: "5242880"
            - name: PREPROC_LARGE_PDF_LOCK_PATH
              value: /tmp/preprocessor-91-large-pdf.lock
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
            limits:
              cpu: "4"
              memory: 16Gi
