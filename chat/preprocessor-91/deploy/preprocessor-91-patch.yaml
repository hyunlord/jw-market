apiVersion: apps/v1
kind: Deployment
metadata:
  name: preprocessor-91
  namespace: llmops
spec:
  template:
    metadata:
      annotations:
        jw-market/source-sha256: 005929b16388071aee3a7fb0b9d42774875cf61f8d4b2d82675faee4bdef8458
    spec:
      containers:
        - name: preprocessor-91
          env:
            - name: PREPROC_PAGE_WORKERS
              value: "8"
            - name: PREPROC_PAGE_WORKER_THREADS
              value: "1"
            - name: PDF_OCR_LANGUAGES
              value: "eng+kor"
            - name: PDF_TEXT_LAYER_MIN_CHARS
              value: "20"
            - name: PREPROC_LARGE_PDF_MIN_PAGES
              value: "50"
            - name: PREPROC_LARGE_PDF_MIN_BYTES
              value: "5242880"
            - name: PREPROC_LARGE_PDF_LOCK_PATH
              value: /tmp/preprocessor-91-large-pdf.lock
          resources:
            requests:
              cpu: "8"
              memory: 16Gi
            limits:
              cpu: "8"
              memory: 16Gi
