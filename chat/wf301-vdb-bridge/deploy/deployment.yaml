# Server-side-apply ownership manifest for stable bridge environment settings.
# Apply only to the existing Deployment with field-manager jw-chat-env-canonicalizer.
# FILE_SQL_ENABLED is intentionally omitted pending a separate policy decision.
# Release automation owns image; security automation owns workload identity.
# Workload automation owns replicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-serving-235
  namespace: llmops
spec:
  template:
    metadata:
      labels:
        security.jwhealthcare.com/identity: code-serving-235
    spec:
      serviceAccountName: code-serving-235-sa
      containers:
      - name: code-serving-235
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: mariadb-root-password
              name: galera-mariadb-galera
        - name: TZ
          value: Asia/Seoul
        - name: PROFILE
          value: prod
        - name: CODE_SERVING_ID
          value: '235'
        - name: CODE_SERVING_DEPLOYMENT_ID
          value: '919'
        - name: REPOSITORY_URL
          value: null
          valueFrom:
            secretKeyRef:
              name: code-serving-235-runtime-secrets
              key: REPOSITORY_URL
        - name: EXTERNAL_PREPROCESSOR_MAX_FILE_MB
          value: '100'
        - name: EXTERNAL_PREPROCESSOR_MAX_PDF_PAGES
          value: '0'
        - name: PDF_TEXT_LAYER_MIN_CHARS
          value: '20'
        - name: PDF_TEXT_PAGE_SECONDS
          value: '0.38'
        - name: PDF_OCR_PAGE_SECONDS
          value: '3.91'
        - name: PDF_MAX_ESTIMATED_SECONDS
          value: '300'
        - name: PREPROCESSOR_TIMEOUT_S
          value: '450'
        - name: EMBED_CHUNKS_PER_PAGE
          value: '4.3'
        - name: EMBED_SECONDS_PER_BATCH
          value: '7.5'
        - name: EMBED_BATCH_SIZE
          value: '64'
        - name: PDF_ADMISSION_SAFETY_FACTOR
          value: '0.8'
        - name: COMMIT_ENABLED
          value: 'true'
        - name: DB_HOST
          value: galera-mariadb-galera
        - name: DB_PORT
          value: '3306'
        - name: DB_NAME
          value: llmops
        - name: DB_USER
          value: root
        - name: TARGET_VDB_ID
          value: '139'
        - name: TARGET_VDB_COLLECTION
          value: Z87cf9950c34b41b48564482b4112613d
        - name: WEAVIATE_BASE
          value: http://llmops-weaviate-service:8080
        - name: EMBEDDING_BASE
          value: http://llmops-gateway-api-service:8080/rep/serving/25
        - name: PREPROCESSOR_ID
          value: '64'
        - name: EMBEDDING_SERVING_ID
          value: '25'
        - name: EMBEDDING_SERVING_REV_ID
          value: '31'
        - name: TTL_DAYS
          value: '7'
        - name: QUOTA_MAX_FILES
          value: '10'
        - name: SEARCH_LIMIT
          value: '5'
        - name: SEARCH_CONTEXT_CHAR_LIMIT
          value: '8000'
        - name: QUOTA_MAX_PER_REQUEST
          value: '10'
        - name: QUOTA_MAX_FILE_MB
          value: '100'
        - name: QUOTA_MAX_SESSION_MB
          value: '100'
