phase_zeta_runner:
  config_version: "phase_zeta_runner_genos_v1"
  builder_version: "2.0.0"

  genos:
    workflow_id: 217
    admin_api_url: "http://llmops-admin-api-service.llmops.svc.cluster.local:8080"
    workflow_api_url: "http://workflow-217.llmops.svc.cluster.local:8080"
    endpoint_path: "/run/v2"
    request_payload_mode: "root_question"
    response_output_path: "auto"
    timeout_sec: 240

  validator:
    tolerance_by_type:
      currency_krw: 0.01
      volume_rx: 0.5
      unit_pack: 0.5
      percent: 0.05
      percent_signed: 0.05
      kpi: 0.05
      rank: 0
    relative_tolerance: 0.001
    tolerance_default: 0.01
    tolerance_percent: 0.05
    tolerance_kpi: 0.05
    cascade_skip_on_fail: false
    bundle_mart_check_enabled: true
    bundle_invariant_check_enabled: true
    narrative_event_check_enabled: true
    narrative_event_warning_only: true
    bundle_invariant_fail_action: "fail"

  composer:
    update_cache_deep_analysis: false
    db_host: "localhost"
    db_port: 3308
    db_user: "root"
    db_name: "jw_mart"

  retry:
    max_attempts: 2
    backoff_sec: 5
