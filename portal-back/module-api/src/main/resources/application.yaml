server:
  port: 80
  tomcat:
    max-part-count: 100

spring:
  devtools:
    restart:
      enabled: false
      additional-exclude: static/**
    livereload:
      enabled: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  web:
    resources:
      static-locations: classpath:/resources/static/
  application:
    name: module-api

jasypt:
  encryptor:
    algorithm: PBEWITHHMACSHA512ANDAES_256
    password: ${JASYPT_ENCRYPTOR_PASSWORD:PBEWITHHMACSHA512ANDAES_256}
    key-obtention-iterations: 10000
    pool-size: 2
    salt-generator-classname: org.jasypt.salt.RandomSaltGenerator
    iv-generator-classname: org.jasypt.iv.RandomIvGenerator
    string-output-type: base64

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${PORTAL_JWT_ISSUER}
    audience: ${PORTAL_JWT_AUDIENCE}
    expiration: 36000
    refresh-expiration: 864000

encoder:
  password:
    #type: bcrypt
    type: argon2

portal:
  auth:
    google:
      client-id: ${PORTAL_GOOGLE_CLIENT_ID}
  security:
    cors:
      allowed-origins: ${PORTAL_CORS_ALLOWED_ORIGINS}
  environment: ${PORTAL_ENV:stage}
  local-no-auth: ${PORTAL_LOCAL_NO_AUTH:false}
  test-login-enabled: ${PORTAL_TEST_LOGIN_ENABLED:false}
  # MARKET Chat SSE streaming is process-local. With two stage replicas,
  # five requests per replica preserves the approved effective 10/minute cap.
  ratelimit:
    market-chat-stream:
      enabled: true
      requests-per-minute: 5
      max-tracked-keys: 20000
  environments:
    stage:
      role-mappings:
        - description: ${PORTAL_STAGE_IAM_ROLE_ALL:관리자 역할}
          code: ALL
        - description: ${PORTAL_STAGE_IAM_ROLE_RND:R&D Agent}
          code: RND
        - description: ${PORTAL_STAGE_IAM_ROLE_MARKET:시장분석 Agent}
          code: MARKET
    dev:
      role-mappings:
        - description: ${PORTAL_DEV_IAM_ROLE_ALL:포탈 개발자}
          code: ALL
    local:
      role-mappings:
        - description: ${PORTAL_LOCAL_IAM_ROLE_ALL:관리자 역할}
          code: ALL
        - description: ${PORTAL_LOCAL_IAM_ROLE_RND:R&D Agent}
          code: RND
        - description: ${PORTAL_LOCAL_IAM_ROLE_MARKET:시장분석 Agent}
          code: MARKET

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

---
spring:
  profiles:
    active: local

# Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    filter: true
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    show-extensions: true
    show-common-extensions: true
    doc-expansion: none
    default-models-expand-depth: 1
    default-model-expand-depth: 1
  show-actuator: false
  override-with-generic-response: false

# Log
logging:
  level:
    #org.springframework.boot.autoconfigure.security: OFF
    org.springframework.security: DEBUG
    org.springframework.security.web: DEBUG
    #org.springframework.security.config.annotation.web.builders: OFF
    #org.springframework.security.web.DefaultSecurityFilterChain: OFF
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: ERROR
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.orm.jpa: DEBUG
    org.springframework.orm.jpa.hibernate.SpringBeanContainer: INFO
    org.springframework.web.servlet.resource.ResourceHandlerUtils: ERROR
    org.hibernate.dialect.Dialect: ERROR
    org.hibernate.orm.deprecation: ERROR

management:
  endpoint:
    health:
      show-details: always

rest:
  api:
    agent:
      jwai:
        base-url: https://admin.dev.ai.jwhealthcare.com
        connect-timeout: 5000
        read-timeout: 600
        write-timeout: 10
        memory-size: 100
      socket:
        base-url: http://llmops-chat-api-service.llmops:8080
        socket-base-url: http://workflow-328.llmops:8080
        socket-path: /socket.io/
        connect-timeout: 5000
        read-timeout: 600
        write-timeout: 10
        memory-size: 100
      market:
        base-url: https://jwai-dev.jwhealthcare.com
        api-key: ${PORTAL_API_KEY}
        connect-timeout: 5000
        read-timeout: 510
        memory-size: 100
        sse-max-frame-mib: ${MARKET_SSE_MAX_FRAME_MIB:16}

agent:
  endpoint:
    rnd: jf32_38ew_wqg6
    rnd.report: ezyo_vrtu_izv8
    market: lz0h_sv3e_2qk2

