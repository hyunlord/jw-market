# Canonical manifest captured from the active llmops CronJob on 2026-07-27.
# Authoring this file does not apply or mutate the live resource.
apiVersion: v1
kind: ConfigMap
metadata:
  name: brand-activity-row-topic-monthly-wrapper
  namespace: llmops
data:
  row_topic_monthly_wrapper.py: |
    from __future__ import annotations

    from dataclasses import dataclass
    from datetime import datetime, timezone
    import json
    import os
    from pathlib import Path
    import subprocess
    import sys
    from typing import Any

    import pymysql


    SCHEMA = os.environ.get("ROW_TOPIC_SCHEMA", "jw_brand_activity_stage")
    HANDOFF_TABLE = "mart_brand_activity_assignment_handoff"
    DEFAULT_MAX_CALLS = int(os.environ.get("ROW_TOPIC_MAX_CALLS", "350"))
    GATE_MAX_CALLS = int(os.environ.get("ROW_TOPIC_GATE_MAX_CALLS", "5"))
    OBSERVATION_TARGET_MODE = "monthly_observation"
    PRODUCER_NOOP = "producer_noop"
    PRODUCER_STARTED = "producer_started"
    PRODUCER_FAILED = "producer_failed"
    PRODUCER_COMPLETE = "producer_complete"


    @dataclass(frozen=True, slots=True)
    class ProducerObservation:
        status: str
        reason: str


    @dataclass(frozen=True, slots=True)
    class ConsumerOutcome:
        code: str
        reason: str


    def _prepare_environment() -> Path:
        project_root = Path(os.environ.get("PROJECT_ROOT", "/app"))
        if str(project_root) not in sys.path:
            sys.path.insert(0, str(project_root))
        os.environ.setdefault("MARIADB_HOST", os.environ.get("DB_HOST", "llmops-mariadb-service.llmops.svc.cluster.local"))
        os.environ.setdefault("MARIADB_PORT", os.environ.get("DB_PORT", "3306"))
        os.environ.setdefault("MARIADB_USER", os.environ.get("DB_USER", "llmops"))
        # The row-topic runner's connection helper reads MARIADB_ROOT_PASSWORD.
        # In this job it intentionally carries the llmops account password.
        if not os.environ.get("MARIADB_ROOT_PASSWORD") and os.environ.get("DB_PASSWORD"):
            os.environ["MARIADB_ROOT_PASSWORD"] = os.environ["DB_PASSWORD"]
        return project_root


    def _connect() -> pymysql.connections.Connection:
        password = os.environ.get("MARIADB_ROOT_PASSWORD")
        if not password:
            raise RuntimeError("DB password env is missing")
        return pymysql.connect(
            host=os.environ["MARIADB_HOST"],
            port=int(os.environ["MARIADB_PORT"]),
            user=os.environ["MARIADB_USER"],
            password=password,
            charset="utf8mb4",
            cursorclass=pymysql.cursors.DictCursor,
            autocommit=True,
        )


    def _pending_topic_set_versions() -> tuple[str, ...]:
        """Return exact completed-axis receipts still requiring reconciliation."""
        sql = f"""
            SELECT run_id
            FROM `{SCHEMA}`.`{HANDOFF_TABLE}`
            WHERE axis_status='complete'
              AND assignment_status IN ('pending','running','gap')
            ORDER BY created_at, run_id
        """
        with _connect() as connection:
            with connection.cursor() as cursor:
                cursor.execute(sql)
                rows = cursor.fetchall()
        return tuple(str(row["run_id"]) for row in rows)


    def _mode_from_job_name() -> str:
        explicit = os.environ.get("GATE_MODE", "").strip().lower()
        if explicit:
            return explicit
        job_name = os.environ.get("JOB_NAME", "").lower()
        if "dryrun" in job_name or "dry-run" in job_name:
            return "dry-run"
        if "execute" in job_name or "live" in job_name:
            return "execute"
        return "auto"


    def _run_row_topic(mode: str, version: str, max_calls: int | None = None) -> dict[str, Any]:
        cmd = [
            sys.executable,
            "-m",
            "pipeline.scripts.analysis.brand_activity.row_topic.execute",
            mode,
            "--schema",
            SCHEMA,
            "--topic-set-version",
            version,
            "--pending-source",
            "db",
            "--checkpoint",
            "/tmp/row_topic_assignment_checkpoint.jsonl",
            "--log",
            "/tmp/row_topic_assignment_execute_log.jsonl",
        ]
        if max_calls is not None:
            cmd.extend(["--max-calls", str(max_calls)])
        completed = subprocess.run(cmd, check=False, text=True, capture_output=True)
        if completed.stdout:
            print(completed.stdout, end="", flush=True)
        if completed.stderr:
            print(completed.stderr, end="", file=sys.stderr, flush=True)
        if completed.returncode != 0:
            raise RuntimeError(f"row-topic {mode} failed with exit {completed.returncode}")
        return _last_json(completed.stdout)


    def _last_json(output: str) -> dict[str, Any]:
        for line in reversed(output.splitlines()):
            stripped = line.strip()
            if stripped.startswith("{") and stripped.endswith("}"):
                return json.loads(stripped)
        raise RuntimeError("row-topic output did not contain a JSON object")


    def main() -> int:
        project_root = _prepare_environment()
        os.chdir(project_root)
        mode = _mode_from_job_name()
        if mode not in {"dry-run", "execute", "auto"}:
            raise RuntimeError(f"unsupported GATE_MODE: {mode}")
        explicit_version = os.environ.get("ROW_TOPIC_SET_VERSION", "").strip()
        versions = (
            (explicit_version,)
            if explicit_version
            else _pending_topic_set_versions()
        )
        if not versions:
            outcome = classify_absent_receipt(_producer_observation())
            print(
                json.dumps(
                    {
                        "event": "row_topic_noop",
                        "producer_outcome": outcome.code,
                        "reason": outcome.reason,
                        "calls": 0,
                        "inserts": 0,
                    },
                    sort_keys=True,
                ),
                flush=True,
            )
            return 0
        for version in versions:
            _process_version(mode, version)
        return 0


    def _producer_observation() -> ProducerObservation | None:
        try:
            with _connect() as connection:
                sql = f"""
    SELECT axis_status, last_error
    FROM `{SCHEMA}`.`{HANDOFF_TABLE}`
    WHERE run_id=%s AND target_mode=%s
    LIMIT 1
    """.strip()
                with connection.cursor() as cursor:
                    cursor.execute(sql, (_observation_run_id(), OBSERVATION_TARGET_MODE))
                    row = cursor.fetchone()
        except Exception as exc:  # noqa: BLE001 - observation failure must not block assignment.
            print(
                json.dumps(
                    {
                        "event": "row_topic_observation_read_failed",
                        "error_type": type(exc).__name__,
                    },
                    sort_keys=True,
                ),
                flush=True,
            )
            return ProducerObservation(
                status="observation_read_failed",
                reason=type(exc).__name__,
            )
        if not row:
            return None
        return ProducerObservation(
            status=str(row["axis_status"]),
            reason=str(row.get("last_error") or ""),
        )


    def classify_absent_receipt(
        observation: ProducerObservation | None,
    ) -> ConsumerOutcome:
        """Classify missing assignment work without changing the zero exit code."""
        if observation is None:
            return ConsumerOutcome("D_producer_not_run", "producer_observation_missing")
        if observation.status == PRODUCER_NOOP:
            return ConsumerOutcome("B_normal_noop", "producer_input_unchanged")
        if observation.status == PRODUCER_STARTED:
            return ConsumerOutcome("C_producer_failed", "producer_started_but_receipt_missing")
        if observation.status == PRODUCER_FAILED:
            return ConsumerOutcome("C_producer_failed", "producer_failed_before_receipt")
        if observation.status == "observation_read_failed":
            return ConsumerOutcome("C_producer_failed", "producer_observation_read_failed")
        if observation.status == PRODUCER_COMPLETE:
            return ConsumerOutcome("A_producer_complete", "producer_complete_no_pending_assignment")
        return ConsumerOutcome("C_producer_failed", "producer_observation_unrecognized")


    def _observation_run_id(observed_at: datetime | None = None) -> str:
        instant = observed_at or datetime.now(timezone.utc)
        if instant.tzinfo is None:
            instant = instant.replace(tzinfo=timezone.utc)
        return f"monthly-axis-observation:{instant.astimezone(timezone.utc):%Y-%m}"


    def _process_version(mode: str, version: str) -> None:
        print(json.dumps({"event": "row_topic_gate_start", "mode": mode, "topic_set_version": version}, sort_keys=True), flush=True)
        dry = _run_row_topic("dry-run", version)
        pending_rows = int(dry.get("pending_rows") or 0)
        pending_batches = int(dry.get("pending_batches") or 0)
        print(
            json.dumps(
                {
                    "event": "row_topic_pending_gate",
                    "mode": mode,
                    "topic_set_version": version,
                    "pending_rows": pending_rows,
                    "pending_batches": pending_batches,
                },
                sort_keys=True,
            ),
            flush=True,
        )
        if mode == "dry-run":
            return
        if pending_rows == 0:
            reconciliation = _run_row_topic("reconcile", version)
            print(
                json.dumps(
                    {
                        "event": "row_topic_reconciled_noop",
                        "topic_set_version": version,
                        "calls": 0,
                        "inserts": 0,
                        "reconciliation": reconciliation,
                    },
                    sort_keys=True,
                ),
                flush=True,
            )
            return
        if not os.environ.get("GENOS_BEARER_TOKEN"):
            raise RuntimeError("GENOS_BEARER_TOKEN is required before executing pending row-topic calls")
        cap = GATE_MAX_CALLS if mode == "execute" else DEFAULT_MAX_CALLS
        result = _run_row_topic("execute", version, max_calls=cap)
        print(json.dumps({"event": "row_topic_execute_complete", "result": result}, ensure_ascii=False, sort_keys=True), flush=True)


    if __name__ == "__main__":
        raise SystemExit(main())
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: brand-activity-row-topic-monthly
  namespace: llmops
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          containers:
          - args:
            - /opt/row-topic/row_topic_monthly_wrapper.py
            command:
            - python
            env:
            - name: PROJECT_ROOT
              value: /app
            - name: DB_HOST
              value: llmops-mariadb-service.llmops.svc.cluster.local
            - name: DB_PORT
              value: '3306'
            - name: DB_USER
              value: llmops
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: mariadb-password
                  name: galera-mariadb-galera
            - name: ROW_TOPIC_SCHEMA
              value: jw_brand_activity_stage
            - name: ROW_TOPIC_MAX_CALLS
              value: '350'
            - name: ROW_TOPIC_GATE_MAX_CALLS
              value: '5'
            - name: JOB_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            image: asia-northeast3-docker.pkg.dev/prj-jw-agn-stg-ai/ar-jw-agn-stg-genos-dev-01/jw-market-backend-api@sha256:e8205158a93cf4cc34abdee2b35a8a3c3d96a4f2fb887e823a58d5a68cb9368a
            imagePullPolicy: IfNotPresent
            name: row-topic-monthly
            volumeMounts:
            - mountPath: /opt/row-topic
              name: wrapper
              readOnly: true
          restartPolicy: Never
          volumes:
          - configMap:
              defaultMode: 420
              name: brand-activity-row-topic-monthly-wrapper
            name: wrapper
  schedule: 0 22 4 * *
  successfulJobsHistoryLimit: 3
  suspend: false
