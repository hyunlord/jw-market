services:
  mariadb:
    image: bitnamilegacy/mariadb-galera:12.0.2-debian-12-r0
    container_name: jw-mariadb
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HOST_PORT:-3307}:3306"
    environment:
      MARIADB_GALERA_CLUSTER_BOOTSTRAP: "yes"
      MARIADB_GALERA_CLUSTER_ADDRESS: "gcomm://"
      MARIADB_GALERA_CLUSTER_NAME: "jw_local_cluster"
      MARIADB_GALERA_MARIABACKUP_USER: "mariabackup"
      MARIADB_GALERA_MARIABACKUP_PASSWORD: "${MARIADB_GALERA_MARIABACKUP_PASSWORD}"
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      MARIADB_DATABASE: "${MARIADB_DATABASE:-jw_mart}"
      MARIADB_USER: "${MARIADB_USER:-jwapp}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD}"
      MARIADB_CHARACTER_SET: "utf8mb4"
      MARIADB_COLLATE: "utf8mb4_unicode_ci"
      MARIADB_EXTRA_FLAGS: "--default-time-zone=+09:00"
    volumes:
      - ./data/mariadb:/bitnami/mariadb
      - ./init:/docker-entrypoint-startdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h 127.0.0.1 -uroot -p\"$${MARIADB_ROOT_PASSWORD}\" --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
