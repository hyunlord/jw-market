# catalog/customer_dictionary.yaml
# JW Mart Pipeline · UBIST + IQVIA customer 매핑
# Version: v0.7

# ============================================================================
# UBIST 종별 (channel) 매핑
# ★ UBIST raw 의 한국어 종별 → MI팀 표기
# ============================================================================
ubist_channel:
  상급종합병원: TH
  종합병원: GH
  병원: Semi
  의원: CL
  보건소: 기타       # ★ 보건소 + 기타 → 기타 (2:1 매핑)
  기타: 기타

# 역방향 (★ MI팀 표기 → UBIST raw values list)
ubist_channel_reverse:
  TH: [상급종합병원]
  GH: [종합병원]
  Semi: [병원]
  CL: [의원]
  기타: [보건소, 기타]

# ============================================================================
# UBIST 진료과 (specialty) 매핑
# ★ UBIST raw 진료과 → MI팀 표기
# ============================================================================
ubist_specialty:
  # IGF = 1:3 매핑 (★ 가정의학과 + 내과 + 일반의 합)
  가정의학과: IGF
  내과: IGF
  일반의: IGF

  # 내과 세부 진료과 — 별도 매핑
  순환기: Cardio       # Cardiology IM
  소화기: GI           # Gastroenterology IM
  내분비: Endo         # Endocrinology IM
  신장: Nephro         # Nephrology IM
  비뇨의학과: Uro      # URO
  신경과: Neuro        # NR

# 역방향 (★ MI팀 표기 → UBIST raw values list)
ubist_specialty_reverse:
  IGF: [가정의학과, 내과, 일반의]    # ★ 1:3 매핑
  Cardio: [순환기]
  GI: [소화기]
  Endo: [내분비]
  Nephro: [신장]
  Uro: [비뇨의학과]
  Neuro: [신경과]

# UBIST 원천의 aggregate parent와 이를 대체하는 atomic specialty 목록.
# Parent 행은 children 전건과 동일 grain을 중복하므로 집계 전에 제외한다.
ubist_specialty_hierarchies:
  "내과(IM)":
    - "알레르기(Allergy IM)"
    - "내분비(Endocrinology IM)"
    - "순환기(Cardiology IM)"
    - "신장(Nephrology IM)"
    - "류마티스(Rheumatology IM)"
    - "소화기(Gastroenterology IM)"
    - "감염(Infection Disease IM)"
    - "혈액종양(Hemoto Oncology IM)"
    - "호흡기(Pulmonology IM)"
    - "분리되지 않은 내과"

# ============================================================================
# IQVIA channel — raw AUDIT CODE 기반 자동 추적
# ============================================================================
iqvia_channel:
  source: raw_audit_code
  auto_trace: true

  # AUDIT CODE 의 prefix / suffix 로 채널 식별
  # 예시 매핑 (★ source-level 확인 필요)
  channel_codes:
    KHPA: # Korea Hospital Pharmacy Audit
      description: "병원 약국"
      pattern: "audit_code 가 KHPA 로 시작 또는 KHPA 코드 포함"
    KCPA: # Korea Community Pharmacy Audit
      description: "지역 약국"
      pattern: "audit_code 가 KCPA 로 시작 또는 KCPA 코드 포함"
    KPA:  # Korea Pharmacy Audit
      description: "전체 약국"
      pattern: "audit_code 가 KPA 로 시작 또는 KPA 코드 포함"

  # ★ 실제 AUDIT CODE 매핑은 raw 데이터 확인 후 정정 필요
  # (Codex audit B-4 에서 확인 가능 evidence 있음)

# ============================================================================
# 적용 흐름
# ============================================================================
# STEP 2 enrichment 에서 다음 logic 으로 적용:
#
# UBIST row 의 종별 column 값 = "상급종합병원"
#   → enriched_fact.channel = "TH"
#   → enriched_fact.channel_raw = "상급종합병원" (★ raw 보존)
#
# UBIST row 의 진료과 column 값 = "가정의학과"
#   → enriched_fact.specialty = "IGF"
#   → enriched_fact.specialty_raw = "가정의학과"
#
# IQVIA row 의 AUDIT CODE = "KHPA_XXX"
#   → enriched_fact.channel = "KHPA"
#   → enriched_fact.channel_raw = audit_code 그대로

# ============================================================================
# Note
# ============================================================================
# - UBIST 의 진료과 column 이 raw 에 어떻게 표기되어 있는지 (★ 완전 일치 / 부분 일치)
#   는 Codex B-4 audit 결과 + raw spot-check 로 확정 필요
# - IGF / 기타 의 1:N 매핑 시 enriched_fact 의 row 가 늘어나지 않도록
#   매핑은 group-by-aggregation 시 적용 (★ 값 변환만)
