# ============================================================================
# ml ↔ cd mapping summary
# ============================================================================
# 1 ml → 2 cd 시장 (★ 3개): ml_008, ml_009, ml_010
# 1 ml → 1 cd 시장 (★ 13개): 나머지
# cd_id 순서 swap: cd_017 (엔커버 ↔ ml_015), cd_018 (위너프 ↔ ml_014)

metric_definitions:
  market_share:
    formula: "brand_value / market_total_value"
    period: current_period
  mom:
    formula: "(current - previous_month) / previous_month"
    period: monthly
  qoq:
    formula: "(current - previous_quarter) / previous_quarter"
    period: quarterly
  yoy:
    formula: "(current - same_period_last_year) / same_period_last_year"
    period: yearly
  mat:
    formula: "trailing 12-month sum"
    period: rolling_12m
  growth_rate:
    formula: "(current - reference) / reference"
    period: configurable
    note: "★ 전년 동월 대비 G/R = 12-month YoY 와 동일"

