# ============================================================================
# cd_filter 19 row · brand 분리 logic
# ============================================================================
# Source: Phase 14 cd_filter.parquet (★ 19 row × 10 column)
# ★ cd_filter 는 brand 직접 경쟁시장 정의의 raw 필터 조건

cd_filter_logic:
  same_ml_split_rule: |
    한 ml 안에 여러 cd 가 있는 경우 (★ 1 ml → 2+ cd):
    - cd_filter 의 brand_match column 으로 분리
    - cd_brand 의 row 가 cd_id 기준 group by 로 분리됨

  same_ml_split_markets:
    - ml_id: ml_008
      detail_sheet: "리바로하이 리바로브이"
      cds: [cd_008, cd_009]
      reason: "brand 직접 경쟁시장 정의 다름 (★ 같은 시트지만)"

    - ml_id: ml_009
      detail_sheet: "트루패스 피나스타 제이다트"
      cds: [cd_010, cd_011]
      reason: "트루패스 vs 피나스타·제이다트 (★ 시트는 묶음 but cd 분리)"

    - ml_id: ml_010
      detail_sheet: "뉴트로진 모빌리아"
      cds: [cd_012, cd_013]
      reason: "두 brand 직접 경쟁시장 정의 다름"

  collapse_markets:
    - ml_id: ml_012
      cd_id: cd_015
      brands: [페린젝트, 베노훼럼]
      reason: "★ 직접 경쟁시장 정의 동일 (★ 사용자 결정)"

# ============================================================================
# cd_id ↔ ml_id swap (★ Phase 14 quirk)
# ============================================================================
# Phase 14 의 cd_id 순서가 ml_id 순서와 일부 swap. catalog 에 명시.
cd_id_swap:
  - cd_id: cd_017
    ml_id: ml_015
    note: "엔커버 (★ cd_id 17 위치지만 ml_id 15)"
  - cd_id: cd_018
    ml_id: ml_014
    note: "위너프 (★ cd_id 18 위치지만 ml_id 14)"
