# Google Cloud Scheduler reference spec. Apply after Cloud Run Jobs are created.
- name: monthly-ubist-load
  schedule: "0 3 1 * *"
  timezone: Asia/Seoul
  target:
    type: cloud-run-job
    job: jw-market-pipeline-monthly
    args: ["load-ubist", "--all", "--truncate"]

- name: monthly-iqvia-load
  schedule: "0 4 1 * *"
  timezone: Asia/Seoul
  target:
    type: cloud-run-job
    job: jw-market-pipeline-monthly
    args: ["load-iqvia", "--all"]

- name: monthly-enrich
  schedule: "0 6 1 * *"
  timezone: Asia/Seoul
  target:
    type: cloud-run-job
    job: jw-market-pipeline-monthly
    args: ["enrich", "--all"]
