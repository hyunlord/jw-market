# Cloud Workflows style orchestration sketch.
# This is a deployment spec, not an applied resource.
main:
  params: [event]
  steps:
    - loadUbist:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/PROJECT_ID/locations/asia-northeast3/jobs/jw-market-pipeline-monthly"}
          body:
            overrides:
              containerOverrides:
                - args: ["load-ubist", "--all", "--truncate"]
    - loadIqvia:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/PROJECT_ID/locations/asia-northeast3/jobs/jw-market-pipeline-monthly"}
          body:
            overrides:
              containerOverrides:
                - args: ["load-iqvia", "--all"]
    - enrich:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/PROJECT_ID/locations/asia-northeast3/jobs/jw-market-pipeline-monthly"}
          body:
            overrides:
              containerOverrides:
                - args: ["enrich", "--all"]
