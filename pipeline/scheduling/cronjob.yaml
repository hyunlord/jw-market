apiVersion: batch/v1
kind: CronJob
metadata:
  name: jw-market-pipeline-monthly
  namespace: llmops
spec:
  schedule: "0 3 1 * *"
  timeZone: "Asia/Seoul"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: sa-jw-agn-stg-ops
          restartPolicy: OnFailure
          containers:
          - name: pipeline
            image: asia-northeast3-docker.pkg.dev/prj-jw-agn-stg-ai/ar-jw-agn-stg-genos-dev-01/jw-market-pipeline:v1
            args: ["all"]
            env:
            - name: PROJECT_ROOT
              value: /app
            - name: LOG_FORMAT
              value: json
            - name: LOG_LEVEL
              value: INFO
            volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: output
              mountPath: /output
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: jw-market-data-pvc
          - name: output
            persistentVolumeClaim:
              claimName: jw-market-output-pvc
