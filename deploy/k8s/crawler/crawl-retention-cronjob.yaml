apiVersion: batch/v1
kind: CronJob
metadata:
  name: jw-news-crawl-retention-daily
  namespace: llmops
  labels:
    app: jw-news-crawl
    crawl-maintenance: retention
spec:
  # Keep suspended until PL approves retention execution.
  suspend: true
  schedule: "0 19 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: jw-news-crawl
            crawl-maintenance: retention
        spec:
          restartPolicy: Never
          containers:
            - name: retention
              image: asia-northeast3-docker.pkg.dev/prj-jw-agn-stg-ai/ar-jw-agn-stg-genos-dev-01/jw-market-crawl@sha256:6b05a5cafae62388f2e2f6806df97c527ce91011e92b23ef408c6e805cc7acb9
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "500m"
                  memory: "1Gi"
              env:
                - name: DB_HOST
                  value: llmops-mariadb-service.llmops.svc.cluster.local
                - name: DB_PORT
                  value: "3306"
                - name: DB_USER
                  value: llmops
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: galera-mariadb-galera
                      key: mariadb-password
                - name: DB_NAME
                  value: jw_mart
              command: ["/bin/sh", "-lc"]
              args:
                - |
                  set -euo pipefail
                  python crawl/crawler/crawl_retention.py \
                    --db-name jw_mart \
                    --apply
