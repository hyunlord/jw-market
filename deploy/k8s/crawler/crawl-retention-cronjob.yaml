apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app: jw-news-crawl
    crawl-maintenance: retention
  name: jw-news-crawl-retention-daily
  namespace: llmops
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata: {}
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: jw-news-crawl
            crawl-maintenance: retention
        spec:
          containers:
          - args:
            - |
              set -euo pipefail
              python crawl/crawler/crawl_retention.py \
                --db-name "$DB_NAME" \
                --apply
            command:
            - /bin/sh
            - -lc
            env:
            - name: DB_HOST
              value: llmops-mariadb-service.llmops.svc.cluster.local
            - name: DB_PORT
              value: '3306'
            - name: D2_WRITER_USER
              valueFrom:
                secretKeyRef:
                  name: jw-mart-d2-writer
                  key: username
            - name: D2_WRITER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jw-mart-d2-writer
                  key: password
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: jw-mart-d2-writer
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jw-mart-d2-writer
                  key: password
            - name: DB_NAME
              value: jw_mart_d2_stage_20260630_r2
            image: asia-northeast3-docker.pkg.dev/prj-jw-agn-stg-ai/ar-jw-agn-stg-genos-dev-01/jw-market-crawl@sha256:b7751229ee62639cefc0ee39f3641d660060235639d48140a61065b082b49bbc
            imagePullPolicy: IfNotPresent
            name: retention
            resources:
              limits:
                cpu: 500m
                memory: 1Gi
              requests:
                cpu: 250m
                memory: 512Mi
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
          dnsPolicy: ClusterFirst
          restartPolicy: Never
          schedulerName: default-scheduler
          securityContext: {}
          terminationGracePeriodSeconds: 30
  schedule: 0 19 * * *
  successfulJobsHistoryLimit: 3
  suspend: true
