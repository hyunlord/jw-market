apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jw-hira-benefit-state
  namespace: llmops
  labels:
    app: jw-hira-benefit-worker
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jw-hira-benefit-state-rwx
  namespace: llmops
  labels:
    app: jw-hira-benefit-worker
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: nfs-client
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jw-hira-benefit-worker
  namespace: llmops
  labels:
    app: jw-hira-benefit-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jw-hira-benefit-worker
  template:
    metadata:
      labels:
        app: jw-hira-benefit-worker
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: knp-jw-agn-dev-genos-api-01
      containers:
      - name: worker
        image: ${IMAGE_DIGEST}
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - pipeline.scripts.crawler.hira_benefit.temporal_worker
        env:
        - name: APP_VERSION
          value: ${APP_VERSION}
        - name: DB_HOST
          value: llmops-mariadb-service.llmops.svc.cluster.local
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          value: ${DB_NAME}
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: ${DB_SECRET_NAME}
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ${DB_SECRET_NAME}
              key: password
        - name: TEMPORAL_ADDRESS
          value: ${TEMPORAL_ADDRESS}
        - name: TEMPORAL_NAMESPACE
          value: ${TEMPORAL_NAMESPACE}
        - name: HIRA_TEMPORAL_TASK_QUEUE
          value: jw-market-hira-benefit-v1
        - name: HIRA_USER_AGENT
          value: JW-Healthcare-DataCollector/1.0 (+mailto:kwanhyeon.park@jwhealthcare.com)
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: state
          mountPath: /var/lib/jw-hira-benefit
      volumes:
      - name: state
        persistentVolumeClaim:
          claimName: jw-hira-benefit-state-rwx
