# RBAC for the ingest trigger service: Job create/read ONLY, own namespace.
# No pod exec, no secrets read, no cluster scope (D-1 (a) minimal-RBAC rationale).
# Registered inert alongside the zero-replica Deployment; applying this file is
# part of the PL-gated activation step, never automated from this repo.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jw-ingest-hook
  namespace: llmops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jw-ingest-hook-jobs
  namespace: llmops
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jw-ingest-hook-jobs
  namespace: llmops
subjects:
  - kind: ServiceAccount
    name: jw-ingest-hook
    namespace: llmops
roleRef:
  kind: Role
  name: jw-ingest-hook-jobs
  apiGroup: rbac.authorization.k8s.io
