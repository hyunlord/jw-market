# Human-reviewable test2 activation overlay. NOT applied directly.
#
# This mirrors the production activation contract while keeping category table
# targets isolated from production serving schemas.
apiVersion: batch/v1
kind: Job
metadata:
  name: jw-ingest-<category>-<sha8>
  namespace: llmops
spec:
  template:
    spec:
      containers:
        - name: ingest
          image: asia-northeast3-docker.pkg.dev/prj-jw-agn-stg-ai/ar-jw-agn-stg-genos-dev-01/jw-pipeline-orchestrator@sha256:567e3941f6793dd7cb73b4dfc42a31bcc58d8606c81238c7831c61dcef04bc79
          env:
            - $patch: replace
            - name: INGEST_LOAD_TARGET_ROOT
              value: /market-output
            - name: INGEST_LOAD_PRODUCTION_DB
              value: jw_mart_test_stage2
            - name: INGEST_MART_PROMOTION_APPROVED
              value: "1"
            - name: INGEST_MART_SOURCE_DB
              value: jw_mart_test_stage2
            - name: INGEST_MART_TARGET_DB
              value: jw_mart_test_stage2
            - name: INGEST_MART_BUILD_PREFIX
              value: jw_mart_test2_ingest
            - name: INGEST_CATEGORY_ACTIVATION_APPROVED
              value: "1"
            - name: INGEST_CATEGORY_ACTIVATION_BUILD_PREFIX
              value: jw_mart_test2_ingest_category
            - name: INGEST_CATEGORY_TARGET_IQVIA_NSA_DB
              value: jw_mart_test_stage2
            - name: INGEST_CATEGORY_TARGET_CSD_RAW_DB
              value: jw_brand_activity_raw_test2
            - name: INGEST_CATEGORY_TARGET_CSD_STAGE_DB
              value: jw_brand_activity_stage_test2
            - name: INGEST_CATEGORY_TARGET_MI_MASTER_DB
              value: jw_mart_test_stage2
            - name: INGEST_PUBLICATION_EPOCH_TABLE
              value: mart_publication_epoch
            - name: INGEST_PUBLICATION_PROVENANCE_TABLE
              value: mart_publication_provenance
            - name: INGEST_COMPLETION_WEBHOOK_URL
              value: http://jw-ingest-hook.llmops.svc.cluster.local/ingest/reconcile
          volumeMounts:
            - name: market-output
              mountPath: /market-output
              readOnly: false
      volumes:
        - name: market-output
          persistentVolumeClaim:
            claimName: llmops-market-output
