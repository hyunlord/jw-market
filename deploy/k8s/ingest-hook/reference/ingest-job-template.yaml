# Staging-only reference template for the incremental ingest Job.
#
# The trigger service renders the equivalent body in code
# (pipeline/scripts/ingest_hook/job_launcher.py::render_job); this file is the
# human-reviewable canon for the env/volume contract the live launcher copies
# at activation. NOT applied directly — Jobs only ever come from the launcher.
apiVersion: batch/v1
kind: Job
metadata:
  name: jw-ingest-<category>-<sha8>          # rendered per submission
  namespace: llmops
  labels:
    app: jw-ingest
    jw-ingest/category: "<category>"
    jw-ingest/manifest-sha8: "<sha8>"
spec:
  backoffLimit: 0                            # retries are a ledger decision, not kubelet's
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 259200
  template:
    metadata:
      labels:
        app: jw-ingest
    spec:
      restartPolicy: Never
      containers:
        - name: ingest
          # Same digest pin as the orchestrator poll CronJob — one code identity.
          image: asia-northeast3-docker.pkg.dev/prj-jw-agn-stg-ai/ar-jw-agn-stg-genos-dev-01/jw-pipeline-orchestrator@sha256:030f81837d05b8789b879fc04ddf0865a7953ddd2cb9d26fc8b707bf394e5e12
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - pipeline.scripts.ingest_hook.stage_log_runner
            - --manifest
            - "<manifest_path>"
            - --run-id
            - "<run_id>"
            - --job-name
            - "jw-ingest-<category>-<sha8>-<run_id>"
          env:
            # Job step 1 is ALWAYS G3 (job_runner enforces the order in code).
            # J5: the real load writes parquet under INGEST_LOAD_STAGING_ROOT and
            # the M-2 gate confirms the uploaded epoch landed; the mart refresh is
            # skipped in this staging-verify posture. Production activation has
            # a separate, mutually exclusive reference overlay.
            - name: INGEST_LOAD_STAGING_ROOT
              value: /tmp/ingest-load-staging
            - name: INGEST_INPUT_BACKEND
              value: local
            - name: INGEST_INPUT_ROOT
              value: /nfs-root/autoIngestion
            - name: INGEST_LOG_ROOT
              value: /market-output/ingest-logs
            # Optional receiver supplied at activation; empty means delivery is
            # explicitly disabled while ledger/status evidence is still kept.
            - name: INGEST_COMPLETION_WEBHOOK_URL
              value: ""
            - name: INGEST_COMPLETION_WEBHOOK_ATTEMPTS
              value: "4"
            - name: MARIADB_HOST
              value: llmops-mariadb-service.llmops.svc.cluster.local
            - name: MARIADB_PORT
              value: "3306"
            - name: MARIADB_DATABASE
              value: jw_mart_d2_stage_20260630_r2
            - name: AGENT3_DB_NAME
              value: jw_mart_d2_stage_20260630_r2
            # Fail-closed rev pins, same double-entry as the orchestrator poll CronJob.
            - name: AGENT3_WORKFLOW_REV
              value: "5692"
            - name: AGENT3_EXPECTED_WORKFLOW_REV
              value: "5692"
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: jw-mart-d2-writer
                  key: username
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jw-mart-d2-writer
                  key: password
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: ingest-input
              mountPath: /nfs-root/autoIngestion
              subPath: autoIngestion
              readOnly: true
            - name: market-output
              mountPath: /market-output
              readOnly: false
      volumes:
        - name: ingest-input
          persistentVolumeClaim:
            claimName: llmops-nfs-root
        - name: market-output
          persistentVolumeClaim:
            claimName: llmops-market-output
