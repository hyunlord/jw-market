# Production activation contract for jw-ingest-hook.
#
# Apply only after the isolated E2E and bounded semantic replay gates pass.
# This env list intentionally replaces, rather than supplements, the staging
# posture: INGEST_LOAD_STAGING_ROOT and INGEST_LOAD_SHADOW_ROOT must be absent.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jw-ingest-hook
  namespace: llmops
spec:
  template:
    spec:
      containers:
        - name: trigger
          env:
            - $patch: replace
            - name: INGEST_LOAD_TARGET_ROOT
              value: /market-output
            - name: INGEST_LOAD_PRODUCTION_DB
              value: jw_mart_d2_stage_20260630_r2
            - name: INGEST_MART_PROMOTION_APPROVED
              value: "1"
            - name: INGEST_MART_SOURCE_DB
              value: jw_mart_d2_stage_20260630_r2
            - name: INGEST_MART_TARGET_DB
              value: jw_mart_d2_stage_20260630_r2
            - name: INGEST_MART_BUILD_PREFIX
              value: jw_mart_ingest
            - name: INGEST_CATEGORY_ACTIVATION_APPROVED
              value: "1"
            - name: INGEST_CATEGORY_ACTIVATION_BUILD_PREFIX
              value: jw_mart_ingest_category
            - name: INGEST_CATEGORY_TARGET_IQVIA_NSA_DB
              value: jw_mart_d2_stage_20260630_r2
            - name: INGEST_CATEGORY_TARGET_CSD_RAW_DB
              value: jw_brand_activity_raw
            - name: INGEST_CATEGORY_TARGET_CSD_STAGE_DB
              value: jw_brand_activity_stage
            - name: INGEST_CATEGORY_TARGET_MI_MASTER_DB
              value: jw_mart_d2_stage_20260630_r2
            - name: INGEST_PUBLICATION_EPOCH_TABLE
              value: mart_publication_epoch
            - name: INGEST_PUBLICATION_PROVENANCE_TABLE
              value: mart_publication_provenance
            - name: INGEST_INPUT_BACKEND
              value: local
            - name: INGEST_INPUT_ROOT
              value: /nfs-root/autoIngestion
            - name: INGEST_LOG_ROOT
              value: /market-output/ingest-logs
            - name: INGEST_COMPLETION_WEBHOOK_URL
              value: http://jw-ingest-hook.llmops.svc.cluster.local/ingest/reconcile
            - name: INGEST_COMPLETION_WEBHOOK_ATTEMPTS
              value: "4"
            - name: BUILD_GIT_SHA
              value: ca49945bc15df260f43134c6026a98fd5a5f47c4
            - name: INGEST_JOB_IMAGE
              value: asia-northeast3-docker.pkg.dev/prj-jw-agn-stg-ai/ar-jw-agn-stg-genos-dev-01/jw-pipeline-orchestrator@sha256:567e3941f6793dd7cb73b4dfc42a31bcc58d8606c81238c7831c61dcef04bc79
            - name: MARIADB_HOST
              value: llmops-mariadb-service.llmops.svc.cluster.local
            - name: MARIADB_PORT
              value: "3306"
            - name: MARIADB_DATABASE
              value: jw_mart_d2_stage_20260630_r2
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: jw-mart-d2-writer
                  key: username
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jw-mart-d2-writer
                  key: password
