# Human-reviewable production activation overlay. NOT applied directly.
#
# This contract is mutually exclusive with ingest-job-template.yaml's
# INGEST_LOAD_STAGING_ROOT. job_launcher renders these fields only when the
# explicit STAGE 5 environment is armed after the PL gate.
apiVersion: batch/v1
kind: Job
metadata:
  name: jw-ingest-<category>-<sha8>
  namespace: llmops
spec:
  template:
    spec:
      containers:
        - name: ingest
          image: asia-northeast3-docker.pkg.dev/prj-jw-agn-stg-ai/ar-jw-agn-stg-genos-dev-01/jw-pipeline-orchestrator@sha256:5f18f01ae8b429936cc2bf09eb8a1795f53e23ad1131182882fa8e4d03cefd25
          env:
            - name: INGEST_LOAD_TARGET_ROOT
              value: /market-output
            - name: INGEST_LOAD_PRODUCTION_DB
              value: jw_mart_d2_stage_20260630_r2
            - name: INGEST_MART_PROMOTION_APPROVED
              value: "1"
            - name: INGEST_MART_SOURCE_DB
              value: jw_mart_d2_stage_20260630_r2
            - name: INGEST_MART_TARGET_DB
              value: jw_mart_d2_stage_20260630_r2
            - name: INGEST_MART_BUILD_PREFIX
              value: jw_mart_ingest
            - name: INGEST_CATEGORY_ACTIVATION_APPROVED
              value: "1"
            - name: INGEST_CATEGORY_ACTIVATION_BUILD_PREFIX
              value: jw_mart_ingest_category
            - name: INGEST_CATEGORY_TARGET_IQVIA_NSA_DB
              value: jw_mart_d2_stage_20260630_r2
            - name: INGEST_CATEGORY_TARGET_CSD_RAW_DB
              value: jw_brand_activity_raw
            - name: INGEST_CATEGORY_TARGET_CSD_STAGE_DB
              value: jw_brand_activity_stage
            - name: INGEST_CATEGORY_TARGET_MI_MASTER_DB
              value: jw_mart_d2_stage_20260630_r2
            - name: INGEST_PUBLICATION_EPOCH_TABLE
              value: mart_publication_epoch
            - name: INGEST_PUBLICATION_PROVENANCE_TABLE
              value: mart_publication_provenance
            - name: INGEST_COMPLETION_WEBHOOK_URL
              value: http://jw-ingest-hook.llmops.svc.cluster.local/ingest/reconcile
          volumeMounts:
            - name: market-output
              mountPath: /market-output
              readOnly: false
      volumes:
        - name: market-output
          persistentVolumeClaim:
            claimName: llmops-market-output
