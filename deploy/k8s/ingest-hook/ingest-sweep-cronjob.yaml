# Loss/terminal sweep — five-minute watchdog. NOT a load batch: on a normal
# day it finds every complete manifest already recorded and exits no-op.
#
# Registered SUSPENDED (suspend: true). Resume is part of the PL-gated
# activation together with the trigger Deployment scale-up.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: jw-ingest-sweep-daily
  namespace: llmops
spec:
  schedule: "*/5 * * * *"        # bounds terminal-ledger blockage to one interval
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: jw-ingest-hook
          nodeSelector:
            cloud.google.com/gke-nodepool: knp-jw-agn-dev-genos-api-01
          containers:
            - name: sweep
              image: asia-northeast3-docker.pkg.dev/prj-jw-agn-stg-ai/ar-jw-agn-stg-genos-dev-01/jw-pipeline-orchestrator@sha256:1975d1cecbfbdfdb50e0f7d23937349d4cce83747b50379e28f6ea7b0d9081be
              imagePullPolicy: IfNotPresent
              command:
                - python
                - -m
                - pipeline.scripts.ingest_hook.sweep
              env:
                # J5: sweep-launched Jobs stage real-load output here (refresh skipped).
                - name: INGEST_LOAD_STAGING_ROOT
                  value: /tmp/ingest-load-staging
                - name: INGEST_INPUT_BACKEND
                  value: local
                - name: INGEST_INPUT_ROOT
                  value: /nfs-root/autoIngestion
                - name: INGEST_JOB_IMAGE
                  value: asia-northeast3-docker.pkg.dev/prj-jw-agn-stg-ai/ar-jw-agn-stg-genos-dev-01/jw-pipeline-orchestrator@sha256:1975d1cecbfbdfdb50e0f7d23937349d4cce83747b50379e28f6ea7b0d9081be
                - name: MARIADB_HOST
                  value: llmops-mariadb-service.llmops.svc.cluster.local
                - name: MARIADB_PORT
                  value: "3306"
                - name: MARIADB_DATABASE
                  value: jw_mart_d2_stage_20260630_r2
                - name: MARIADB_USER
                  valueFrom:
                    secretKeyRef:
                      name: jw-mart-d2-writer
                      key: username
                - name: MARIADB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: jw-mart-d2-writer
                      key: password
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: ingest-input
                  mountPath: /nfs-root/autoIngestion
                  subPath: autoIngestion
                  readOnly: true
          volumes:
            - name: ingest-input
              persistentVolumeClaim:
                claimName: llmops-nfs-root
