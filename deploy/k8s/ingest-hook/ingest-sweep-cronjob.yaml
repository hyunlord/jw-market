# Loss sweep — daily watchdog for lost webhooks. NOT a load batch: on a normal
# day it finds every complete manifest already recorded and exits no-op.
#
# Registered SUSPENDED (suspend: true). Resume is part of the PL-gated
# activation together with the trigger Deployment scale-up.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: jw-ingest-sweep-daily
  namespace: llmops
spec:
  schedule: "30 19 * * *"        # 04:30 KST daily
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: jw-ingest-hook
          nodeSelector:
            cloud.google.com/gke-nodepool: knp-jw-agn-dev-genos-api-01
          containers:
            - name: sweep
              image: asia-northeast3-docker.pkg.dev/prj-jw-agn-stg-ai/ar-jw-agn-stg-genos-dev-01/jw-pipeline-orchestrator@sha256:717014ae78bf3091e182ed0158fc9ff3618233b60fd76afc15457d4eba3b189d
              imagePullPolicy: IfNotPresent
              command:
                - python
                - -m
                - pipeline.scripts.ingest_hook.sweep
              env:
                # J5: sweep-launched Jobs stage real-load output here (refresh skipped).
                - name: INGEST_LOAD_STAGING_ROOT
                  value: /tmp/ingest-load-staging
                - name: INGEST_S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: jw-data-portal-secrets
                      key: MINIO_MARKET_BUCKET
                - name: MINIO_ENDPOINT
                  value: "http://minio.llmops.svc.cluster.local:9000"
                - name: MINIO_REGION
                  value: "us-east-1"
                - name: MINIO_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: jw-ingest-hook-minio   # read-only user; portal creds are write-only
                      key: MINIO_ACCESS_KEY
                - name: MINIO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: jw-ingest-hook-minio
                      key: MINIO_SECRET_KEY
                - name: MARIADB_HOST
                  value: llmops-mariadb-service.llmops.svc.cluster.local
                - name: MARIADB_PORT
                  value: "3306"
                - name: MARIADB_DATABASE
                  value: jw_mart_d2_stage_20260630_r2
                - name: MARIADB_USER
                  valueFrom:
                    secretKeyRef:
                      name: jw-mart-d2-writer
                      key: username
                - name: MARIADB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: jw-mart-d2-writer
                      key: password
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
