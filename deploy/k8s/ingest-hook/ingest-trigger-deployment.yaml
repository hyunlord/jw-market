# Ingest trigger service (D-1 option (a)) — webhook receiver + ledger status API.
#
# Registered INERT: replicas 0. Activation (scale to 1) is a PL decision after
# the jw-data-input confirm flow lands and the isolation gates (G-1..G-5) are
# accepted. Serving (jw-market-backend-api) is untouched by design.
#
# Reuses the digest-pinned pipeline-orchestrator image (fastapi/uvicorn/PyMySQL
# already inside) — no new build pipeline.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jw-ingest-hook
  namespace: llmops
  labels:
    app: jw-ingest-hook
spec:
  replicas: 0
  selector:
    matchLabels:
      app: jw-ingest-hook
  template:
    metadata:
      labels:
        app: jw-ingest-hook
    spec:
      serviceAccountName: jw-ingest-hook
      containers:
        - name: trigger
          # Keep in lockstep with deploy/k8s/orchestrator/pipeline-orchestrator-poll-cronjob.yaml
          image: asia-northeast3-docker.pkg.dev/prj-jw-agn-stg-ai/ar-jw-agn-stg-genos-dev-01/jw-pipeline-orchestrator@sha256:e79aa0986a4e2163849d97d4b3aafacd05fe4db7fc3db48dc36a96164b4c46d8
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - uvicorn
            - --factory
            - pipeline.scripts.ingest_hook.app:build
            - --host
            - "0.0.0.0"
            - --port
            - "8080"
          env:
            # J5 real-loader staging output. INGEST_LOAD_STAGING_ROOT keeps the
            # parquet output isolated and SKIPS the mart-writing refresh (D-3
            # swaps this for INGEST_LOAD_TARGET_ROOT on a mounted live parquet
            # root under PL gate). Carried to launched Jobs by job_launcher.
            - name: INGEST_LOAD_STAGING_ROOT
              value: /tmp/ingest-load-staging
            # Submissions live in the MinIO market bucket (contract v2.1);
            # same secret keys the portal uses. S3 mode makes INGEST_INPUT_ROOT unnecessary.
            - name: INGEST_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: jw-data-portal-secrets
                  key: MINIO_MARKET_BUCKET
            - name: MINIO_ENDPOINT
              value: "http://minio.llmops.svc.cluster.local:9000"
            - name: MINIO_REGION
              value: "us-east-1"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: jw-ingest-hook-minio   # read-only user; portal creds are write-only
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: jw-ingest-hook-minio
                  key: MINIO_SECRET_KEY
            - name: MARIADB_HOST
              value: llmops-mariadb-service.llmops.svc.cluster.local
            - name: MARIADB_PORT
              value: "3306"
            - name: MARIADB_DATABASE
              value: jw_mart_d2_stage_20260630_r2
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: jw-mart-d2-writer
                  key: username
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jw-mart-d2-writer
                  key: password
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: jw-ingest-hook
  namespace: llmops
spec:
  selector:
    app: jw-ingest-hook
  ports:
    - port: 8080
      targetPort: 8080
