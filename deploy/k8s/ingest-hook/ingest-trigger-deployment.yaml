# Ingest trigger service (D-1 option (a)) — webhook receiver + ledger status API.
#
# Armed for the D-3a isolated-load pilot: the trigger is live at one replica,
# while INGEST_LOAD_STAGING_ROOT keeps loader output away from the serving
# parquet root and mart refresh. The loss sweep remains suspended separately.
# Serving (jw-market-backend-api) is untouched by design.
#
# Reuses the digest-pinned pipeline-orchestrator image (fastapi/uvicorn/PyMySQL
# already inside) — no new build pipeline.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jw-ingest-hook
  namespace: llmops
  labels:
    app: jw-ingest-hook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jw-ingest-hook
  template:
    metadata:
      labels:
        app: jw-ingest-hook
    spec:
      serviceAccountName: jw-ingest-hook
      containers:
        - name: trigger
          # Keep in lockstep with deploy/k8s/orchestrator/pipeline-orchestrator-poll-cronjob.yaml
          image: asia-northeast3-docker.pkg.dev/prj-jw-agn-stg-ai/ar-jw-agn-stg-genos-dev-01/jw-pipeline-orchestrator@sha256:fb606f176280a32437f1731b73e1e2f2c196fd9f0feddf74a2bc63bb29bed8ca
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - uvicorn
            - --factory
            - pipeline.scripts.ingest_hook.app:build
            - --host
            - "0.0.0.0"
            - --port
            - "8080"
          env:
            # J5 real-loader staging output. INGEST_LOAD_STAGING_ROOT keeps the
            # parquet output isolated and SKIPS the mart-writing refresh (D-3
            # swaps this for INGEST_LOAD_TARGET_ROOT on a mounted live parquet
            # root under PL gate). Carried to launched Jobs by job_launcher.
            - name: INGEST_LOAD_STAGING_ROOT
              value: /tmp/ingest-load-staging
            - name: INGEST_INPUT_BACKEND
              value: local
            - name: INGEST_INPUT_ROOT
              value: /nfs-root/autoIngestion
            - name: INGEST_JOB_IMAGE
              value: asia-northeast3-docker.pkg.dev/prj-jw-agn-stg-ai/ar-jw-agn-stg-genos-dev-01/jw-pipeline-orchestrator@sha256:fb606f176280a32437f1731b73e1e2f2c196fd9f0feddf74a2bc63bb29bed8ca
            - name: MARIADB_HOST
              value: llmops-mariadb-service.llmops.svc.cluster.local
            - name: MARIADB_PORT
              value: "3306"
            - name: MARIADB_DATABASE
              value: jw_mart_d2_stage_20260630_r2
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: jw-mart-d2-writer
                  key: username
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jw-mart-d2-writer
                  key: password
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: ingest-input
              mountPath: /nfs-root/autoIngestion
              readOnly: true
      volumes:
        - name: ingest-input
          persistentVolumeClaim:
            claimName: llmops-nfs-root
---
apiVersion: v1
kind: Service
metadata:
  name: jw-ingest-hook
  namespace: llmops
spec:
  selector:
    app: jw-ingest-hook
  ports:
    - port: 8080
      targetPort: 8080
