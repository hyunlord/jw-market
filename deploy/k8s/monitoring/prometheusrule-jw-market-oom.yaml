# 누락된 OOMKilled 알림 규칙 (2026-07-27 신규)
#
# 배경: kube-prometheus-stack 기본 규칙 25종에는 Job 실패(KubeJobFailed),
#       Pod 미준비(KubePodNotReady), CrashLoop(KubePodCrashLooping),
#       HPA 포화(KubeHpaMaxedOut) 는 있으나 **OOMKilled 규칙이 없다**.
#       2026-07-24 UBIST 인입 Job 의 32GiB OOM 도, 최근 24시간 chat-agent OOM 4건도
#       이 공백 때문에 별도 신호가 없었다(KubeJobFailed 로 간접 포착될 뿐).
#
# expr 설계
#   - 단순히 kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1 로 쓰면
#     그 파드가 살아있는 내내 계속 발화한다(해소되지 않음).
#   - 그래서 "최근 10분 내 재시작이 있었고 AND 그 종료 사유가 OOMKilled" 로 교차 판정한다.
#     발화 후 스스로 해소된다.
#
# 검증 (2026-07-27, 라이브 Prometheus)
#   - instant  : 0 series (최근 10분 내 OOM 재시작 없음 — 정상)
#   - 24h range: 5 series 발화, 각 1~3 포인트만 유지 = 자기해소 확인
#                jw-chat-agent-poc x4, jw-ingest-hook x1
#
# 배치 namespace 는 llmops (우리 소관) 다. monitoring ns 가 아니어도 된다 —
# 라이브 확인(2026-07-27):
#   ruleSelector          = {"matchLabels":{"release":"prom"}}
#   ruleNamespaceSelector = {}          <- 빈 셀렉터 = **모든 namespace** 수집
# 따라서 llmops 에 두어도 Prometheus 가 그대로 수집하며, 플랫폼 ns 를 건드리지 않는다.
#
# ★★ 범위 주의 (2026-07-27) — 이 규칙은 llmops **전체**를 본다
#   24h 검증에서 발화한 5건 중 **4건이 jw-chat-agent-poc**(채팅 소관)이다.
#   즉 이 안(안1)은 채팅 영역 OOM 도 우리 알림으로 올린다.
#   우리 워크로드만 보려면 -> prometheusrule-jw-market-oom-scoped.yaml (안2, 1건)
#   ★ 두 파일은 metadata.name·alert 이름이 같으므로 **하나만** 적용할 것.
#   판단 재료: 안2 로 좁히면 chat-agent OOM 을 아무도 못 본다. 채팅 영역이
#   자체 규칙을 갖기 전까지는 안1 이 오히려 안전할 수 있다.
#
# ★ 이 파일은 아직 적용하지 않았다. 적용 판단은 PL 몫이다.
#   적용: kubectl apply -f deploy/k8s/monitoring/prometheusrule-jw-market-oom.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: jw-market-oom-rules
  namespace: llmops
  labels:
    # kube-prometheus-stack 의 ruleSelector 가 이 라벨로 규칙을 수집한다. 변경 금지.
    release: prom
spec:
  groups:
    - name: jw-market-oom
      rules:
        - alert: KubeContainerOOMKilled
          expr: |
            (increase(kube_pod_container_status_restarts_total{namespace="llmops"}[10m]) >= 1)
            and ignoring(reason)
            (max_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled",namespace="llmops"}[10m]) == 1)
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Container OOMKilled."
            description: >-
              Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }}
              was OOMKilled. 컨테이너 memory limit 을 초과했다. limit 증액 또는
              작업 단위 축소(청킹/스필) 중 하나가 필요하다.
