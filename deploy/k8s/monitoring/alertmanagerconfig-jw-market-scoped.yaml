# ╔════════════════════════════════════════════════════════════════════════╗
# ║  안2 · 축소 매처 — 적용 금지 (수신처 미확정 · 범위 선택은 PL 몫)         ║
# ║  안1(alertmanagerconfig-jw-market.yaml)과 **택일**한다. 둘 다 적용 금지. ║
# ╚════════════════════════════════════════════════════════════════════════╝
#
# 왜 안2 가 필요한가
# -------------------
# 안1 은 매처가 namespace="llmops" 하나다. 그런데 llmops 는 **공유 namespace** 로
# 우리 것 외에 chat-agent · litellm · vertex-proxy · code-serving · preprocessor ·
# workflow · mcp-* (GenOS 플랫폼) 이 전부 같이 들어 있다.
# 따라서 안1 은 "우리 알림만" 이 아니라 **llmops 전체 알림**을 받는다.
# 직전 라운드 보고문의 "우리 알림만" 표현은 부정확했다 — 이 파일이 그 정정이다.
#
# 실측 (2026-07-27, Alertmanager /api/v2/alerts): llmops 발화 29건의 소관 분포
#   jw market 18 · platform/GenOS 6 · jw agent 3 · jw chat 1 · [미확인] 1
#   -> 안1 을 적용하면 우리 소관이 아닌 10건도 함께 수신된다.
#
# 왜 매처가 이렇게 장황한가 — 단일 매처로는 불가능하다
# ---------------------------------------------------
# kube-prometheus-stack 알림은 **워크로드 식별 라벨이 알림마다 다르다** (실측):
#   KubeJobFailed / KubeJobNotCompleted      -> job_name
#   KubeDeploymentReplicasMismatch           -> deployment
#   KubeHpaMaxedOut                          -> horizontalpodautoscaler
#   KubePodNotReady / KubeContainerWaiting   -> pod
#   (그 외 statefulset / daemonset)
# 게다가 **owner/team 을 나타내는 공통 라벨이 없다**. 존재하는 app 계열 라벨은
# `service=prom-kube-state-metrics` 로 지표 수집원(exporter)일 뿐 워크로드가 아니다.
# ★주의: KSM 이 원천인 알림(KubeDeploymentReplicasMismatch/KubeHpaMaxedOut)은
#   `pod` 라벨이 **exporter 파드**(prom-kube-state-metrics-…)다. pod 로 우리 것을
#   거르려 하면 이들은 절대 매칭되지 않는다. 그래서 라벨별 서브라우트가 필요하다.
#
# 동작
#   상위 라우트(namespace=llmops)의 기본 수신처를 **jw-market-drop**(설정 없는 빈 수신처
#   = 폐기)으로 두고, 우리 워크로드에 해당하는 서브라우트만 jw-market-notify 로 보낸다.
#   -> llmops 안에서 우리 것만 전달, 나머지는 기존과 동일하게 폐기.
#
# amtool 검증 완료 (2026-07-27, evidence/amtool_two_variants.txt)
#   KubeJobFailed job_name=dynamic-market-cache-warm-…      안1 notify / 안2 **notify** ✔
#   KubeJobFailed job_name=jw-ingest-ubist-…                안1 notify / 안2 **notify** ✔
#   KubeHpaMaxedOut hpa=jw-market-backend-api-hpa           안1 notify / 안2 **notify** ✔
#   KubeHpaMaxedOut hpa=jw-chat-agent-poc-hpa               안1 notify / 안2 **drop**   ✔ (chat 제외 증명)
#   KubeDeploymentReplicasMismatch deployment=preprocessor-19  안1 notify / 안2 **drop** ✔
#   KubePodNotReady pod=mcp-bundle-…                        안1 notify / 안2 **drop**   ✔
#   Watchdog                                                양쪽 null ✔
#   namespace=cicd                                          양쪽 null ✔
#
# 트레이드오프 (PL 판단 재료)
#   안1 : 설정이 단순하고 누락이 없다. 대신 남의 알림 10건이 섞여 온다.
#   안2 : 우리 것만 온다. 대신 **새 워크로드를 만들 때 정규식에 추가하지 않으면 조용히 누락된다**.
#         (누락은 알림이 안 오는 형태라 알아채기 어렵다 — 이것이 안2 의 주된 위험이다)
#   중간안: 안1 로 시작해 소음이 문제가 되면 안2 로 좁히는 것도 가능하다.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: jw-market-alerts
  namespace: llmops
spec:
  route:
    # llmops 이면서 아래 서브라우트에 해당하지 않으면 -> drop(폐기)
    receiver: jw-market-drop
    groupBy: [namespace, alertname]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    routes:
      # Job 계열 (KubeJobFailed / KubeJobNotCompleted)
      - receiver: jw-market-notify
        matchers:
          - name: job_name
            matchType: "=~"
            value: "^(jw-market|jw-ingest|jw-cache-refresh|dynamic-market-cache-warm|jw-news-crawl|jw-gitea|r1-|f116).*"
      # Deployment 계열 (KubeDeploymentReplicasMismatch 등)
      - receiver: jw-market-notify
        matchers:
          - name: deployment
            matchType: "=~"
            value: "^(jw-market|jw-data-portal|jw-ingest-hook|jw-brand-activity|jw-news-tier2|jw-market-crawl).*"
      # HPA 계열 (KubeHpaMaxedOut) — jw-market-* 만. jw-chat-agent-poc-hpa 는 제외된다
      - receiver: jw-market-notify
        matchers:
          - name: horizontalpodautoscaler
            matchType: "=~"
            value: "^jw-market-.*"
      # Pod 계열 (KubePodNotReady / KubeContainerWaiting)
      - receiver: jw-market-notify
        matchers:
          - name: pod
            matchType: "=~"
            value: "^(jw-market|jw-data-portal|jw-ingest|dynamic-market-cache-warm|jw-cache-refresh|r1-|f116).*"
  receivers:
    - name: jw-market-notify
      webhookConfigs:
        - url: http://PLACEHOLDER-RECEIVER.invalid/alert   # ← 수신처 확정 후 교체
          sendResolved: true
    # 설정이 없는 수신처 = 조용히 폐기. 안1 의 "null" 과 동일한 역할.
    - name: jw-market-drop
