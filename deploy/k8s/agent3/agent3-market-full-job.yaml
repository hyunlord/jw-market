apiVersion: batch/v1
kind: Job
metadata:
  name: jw-agent3-market-full-manual
  namespace: llmops
  labels:
    app: jw-agent3
    component: strategic-brand-strength
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 28800
  template:
    metadata:
      labels:
        app: jw-agent3
        component: strategic-brand-strength
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      nodeSelector:
        genos: "enabled"
      containers:
        - name: agent3-market
          image: asia-northeast3-docker.pkg.dev/prj-jw-agn-stg-ai/ar-jw-agn-stg-genos-dev-01/jw-market-backend-api@sha256:8fc03788b8b4fcbcad8f89adfda0ae8d5fdb2eff6a2f194e1ffe8013b16cacf8
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          env:
            - name: AGENT3_DB_HOST
              value: llmops-mariadb-service.llmops.svc.cluster.local
            - name: AGENT3_DB_PORT
              value: "3306"
            - name: AGENT3_DB_USER
              valueFrom:
                secretKeyRef:
                  name: jw-mart-d2-writer
                  key: username
            - name: AGENT3_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jw-mart-d2-writer
                  key: password
            - name: AGENT3_DB_NAME
              value: jw_mart_d2_stage_20260630_r2
            - name: WF316_DIRECT_RUN_URL
              value: http://workflow-316.llmops.svc.cluster.local:8080/run/v2
            - name: AGENT3_WORKFLOW_REV
              value: "5692"
            - name: AGENT3_MARKET_WORKLIST
              value: /work/agent3_market_worklist.tsv
            - name: AGENT3_MARKET_OUTPUT
              value: /tmp/agent3_market_result.json
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              cd /app
              python -m pipeline.scripts.agent3.run_market_source \
                --worklist "${AGENT3_MARKET_WORKLIST}" \
                --mode full \
                --expected-workflow-rev 5692 \
                --output "${AGENT3_MARKET_OUTPUT}"
              cat "${AGENT3_MARKET_OUTPUT}"
