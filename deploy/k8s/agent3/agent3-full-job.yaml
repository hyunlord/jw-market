apiVersion: batch/v1
kind: Job
metadata:
  name: jw-agent3-full-manual
  namespace: llmops
  labels:
    app: jw-agent3
    component: brand-strength
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 14400
  template:
    metadata:
      labels:
        app: jw-agent3
        component: brand-strength
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      nodeSelector:
        genos: "enabled"
      containers:
        - name: agent3
          image: asia-northeast3-docker.pkg.dev/prj-jw-agn-stg-ai/ar-jw-agn-stg-genos-dev-01/jw-market-backend-api:v0.9.55-agent3-a1d4e673-20260705
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          env:
            - name: AGENT3_DB_HOST
              value: llmops-mariadb-service.llmops.svc.cluster.local
            - name: AGENT3_DB_PORT
              value: "3306"
            - name: AGENT3_DB_USER
              value: llmops
            - name: AGENT3_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: galera-mariadb-galera
                  key: mariadb-password
            - name: AGENT3_DB_NAME
              value: jw_mart
            - name: WF316_DIRECT_RUN_URL
              value: http://workflow-316.llmops.svc.cluster.local:8080/run/v2
            - name: AGENT3_BRAND_SOURCE
              value: general_all
            - name: AGENT3_MODE
              value: dry-run
            - name: AGENT3_CHUNK_INDEX
              value: "0"
            - name: AGENT3_CHUNK_SIZE
              value: "500"
            - name: AGENT3_OUTPUT
              value: /tmp/agent3_full_result.json
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              cd /app
              python -m pipeline.scripts.agent3.run_full \
                --brand-source "${AGENT3_BRAND_SOURCE}" \
                --mode "${AGENT3_MODE}" \
                --chunk-index "${AGENT3_CHUNK_INDEX}" \
                --chunk-size "${AGENT3_CHUNK_SIZE}" \
                --output "${AGENT3_OUTPUT}"
              cat "${AGENT3_OUTPUT}"
