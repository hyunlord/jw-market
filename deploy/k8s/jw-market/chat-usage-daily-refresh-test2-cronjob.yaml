apiVersion: batch/v1
kind: CronJob
metadata:
  name: jw-chat-usage-daily-refresh-test2
  namespace: llmops
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: refresher
              image: JW_MARKET_API_IMAGE
              imagePullPolicy: IfNotPresent
              command:
                - python
                - -m
                - pipeline.scripts.etl.refresh_chat_usage_daily
              env:
                - name: MARIADB_HOST
                  value: galera-mariadb-galera.llmops.svc.cluster.local
                - name: MARIADB_PORT
                  value: "3306"
                - name: MARIADB_USER
                  value: root
                - name: MARIADB_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: galera-mariadb-galera
                      key: mariadb-root-password
                - name: CHAT_USAGE_REFRESH_DAYS
                  value: "7"
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
