apiVersion: batch/v1
kind: CronJob
metadata:
  name: dynamic-market-cache-warm
  namespace: llmops
spec:
  schedule: "7,37 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: warmer
              image: JW_MARKET_API_IMAGE
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - >-
                  python -m pipeline.scripts.api.dynamic_market.cache_maintenance
                  --batch-limit 100 --max-batches 10 --grace-seconds 300;
                  python -m pipeline.scripts.api.dynamic_market.warm_cache
                  --base-url http://jw-market-backend-api-service
                  --timeout-seconds 120 --workers 3
              resources:
                requests:
                  cpu: 100m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 128Mi
