  name: cache-refresh-validator
  namespace: llmops
  labels:
    app: jw-cache-refresh
    component: cache-deep-analysis
data:
  cache_deep_analysis_refresh_validate.py: |
    from __future__ import annotations

    import argparse
    import copy
    import hashlib
    import json
    import os
    import re
    import sys
    from collections.abc import Mapping
    from dataclasses import dataclass
    from pathlib import Path
    from typing import Any, Final

    import pymysql

    for candidate in (Path("/app"), Path("/workspace")):
        if (candidate / "pipeline").exists():
            sys.path.insert(0, str(candidate))
            break

    from pipeline.scripts.api.composers.cache_to_response import compose_cached_json


    REPRESENTATIVE_BRANDS: Final[tuple[str, ...]] = ("리바로젯", "악템라", "헴리브라", "엔커버", "페린젝트", "가드렛")
    REQUIRED_TOP_KEYS: Final[frozenset[str]] = frozenset(
        {"available_combos", "brand", "brand_name", "data", "generated_at", "market_id"}
    )
    REQUIRED_DATA_KEYS: Final[frozenset[str]] = frozenset({"ai_analysis", "events", "forecast", "simulation"})
    REQUIRED_EVENT_KEYS: Final[frozenset[str]] = frozenset(
        {
            "body_full",
            "category",
            "category_label",
            "date",
            "id",
            "impact_score",
            "on_chart",
            "on_list",
            "period_map",
            "related_coverage_count",
            "related_sources",
            "related_titles",
            "related_urls",
            "source",
            "source_url",
            "summary",
            "title",
            "url",
        }
    )


    class CacheRefreshValidationError(RuntimeError):
        pass


    @dataclass(frozen=True, slots=True)
    class ValidationSummary:
        live_rows: int
        staging_rows: int
        rows_with_events: int
        total_events: int
        non_events_diff_count: int
        forecast_diff_count: int
        contract_error_count: int
        aktemra_analysis_levels_equal: bool

        def to_json(self) -> dict[str, int | bool]:
            return {
                "live_rows": self.live_rows,
                "staging_rows": self.staging_rows,
                "rows_with_events": self.rows_with_events,
                "total_events": self.total_events,
                "non_events_diff_count": self.non_events_diff_count,
                "forecast_diff_count": self.forecast_diff_count,
                "contract_error_count": self.contract_error_count,
                "aktemra_analysis_levels_equal": self.aktemra_analysis_levels_equal,
            }


    def quote_ident(name: str) -> str:
        if not re.fullmatch(r"[A-Za-z0-9_]+", name or ""):
            raise CacheRefreshValidationError(f"unsafe table name: {name!r}")
        return "`" + name.replace("`", "``") + "`"


    def stable_json_hash(value: Any) -> str:
        return hashlib.sha256(json.dumps(value, ensure_ascii=False, sort_keys=True, default=str).encode()).hexdigest()


    def decode_cache_payload(raw: str | None) -> dict[str, Any]:
        payload = compose_cached_json(raw)
        if not isinstance(payload, dict):
            raise CacheRefreshValidationError("cache payload must compose to object")
        return payload


    def api_like_payload(payload: Mapping[str, Any], updated_at: Any, ai_analysis: Mapping[str, Any] | None) -> dict[str, Any]:
        out = copy.deepcopy(dict(payload))
        out["generated_at"] = str(updated_at)
        data = out.setdefault("data", {})
        if isinstance(data, dict):
            data["ai_analysis"] = dict(ai_analysis or {})
            data.pop("brand_strength", None)
        return out


    def strip_events(payload: Mapping[str, Any]) -> dict[str, Any]:
        out = copy.deepcopy(dict(payload))
        data = out.get("data")
        if isinstance(data, dict):
            data.pop("events", None)
        return out


    def analysis_levels(payload: Mapping[str, Any]) -> Any:
        data = payload.get("data")
        if not isinstance(data, Mapping):
            return None
        return data.get("analysis_levels")


    def event_contract_errors(event: Any, label: str, index: int) -> list[str]:
        if not isinstance(event, Mapping):
            return [f"{label}:event[{index}] is not object"]
        missing = sorted(REQUIRED_EVENT_KEYS.difference(str(key) for key in event.keys()))
        errors = [f"{label}:event[{index}] missing {key}" for key in missing]
        if "on_list" in event and not isinstance(event["on_list"], bool):
            errors.append(f"{label}:event[{index}].on_list is not bool")
        if "on_chart" in event and not isinstance(event["on_chart"], bool):
            errors.append(f"{label}:event[{index}].on_chart is not bool")
        if "period_map" in event and not isinstance(event["period_map"], Mapping):
            errors.append(f"{label}:event[{index}].period_map is not object")
        return errors


    def payload_contract_errors(payload: Mapping[str, Any], label: str) -> list[str]:
        missing_top = sorted(REQUIRED_TOP_KEYS.difference(payload.keys()))
        errors = [f"{label}:missing top key {key}" for key in missing_top]
        data = payload.get("data")
        if not isinstance(data, Mapping):
            return [*errors, f"{label}:data is not object"]
        missing_data = sorted(REQUIRED_DATA_KEYS.difference(str(key) for key in data.keys()))
        errors.extend(f"{label}:missing data key {key}" for key in missing_data)
        events = data.get("events")
        if not isinstance(events, list):
            return [*errors, f"{label}:events is not list"]
        for index, event in enumerate(events):
            errors.extend(event_contract_errors(event, label, index))
        return errors


    def validate_tables(conn: Any, live_table: str, staging_table: str) -> ValidationSummary:
        with conn.cursor() as cur:
            cur.execute(f"SELECT COUNT(*) AS c FROM {quote_ident(live_table)}")
            live_rows = int(cur.fetchone()["c"])
            cur.execute(f"SELECT COUNT(*) AS c FROM {quote_ident(staging_table)}")
            staging_rows = int(cur.fetchone()["c"])
            if live_rows <= 0:
                raise CacheRefreshValidationError("live cache_deep_analysis is empty")
            if staging_rows != live_rows:
                raise CacheRefreshValidationError(f"staging row count {staging_rows} != live row count {live_rows}")

            cur.execute(
                """
                SELECT brand, ai_analysis_json
                FROM cache_deep_analysis_ai_analysis
                WHERE brand IN %s
                """,
                (REPRESENTATIVE_BRANDS,),
            )
            ai_by_brand = {row["brand"]: json.loads(row.get("ai_analysis_json") or "{}") for row in cur.fetchall()}

            cur.execute(
                f"""
                SELECT s.brand, s.market_id, s.updated_at, s.response_json AS staging_json,
                       l.response_json AS live_json
                FROM {quote_ident(staging_table)} s
                JOIN {quote_ident(live_table)} l USING (brand, market_id)
                ORDER BY s.brand, s.market_id
                """
            )
            rows = cur.fetchall()

        rows_with_events = 0
        total_events = 0
        non_events_diff: list[str] = []
        forecast_diff: list[str] = []
        contract_errors: list[str] = []
        aktemra_live_levels: list[Any] = []
        aktemra_staging_levels: list[Any] = []

        for row in rows:
            label = f"{row['brand']}::{row['market_id']}"
            live_payload = decode_cache_payload(row.get("live_json"))
            staging_payload = decode_cache_payload(row.get("staging_json"))
            api_payload = api_like_payload(staging_payload, row.get("updated_at"), ai_by_brand.get(row["brand"]))
            contract_errors.extend(payload_contract_errors(api_payload, label))
            events = ((api_payload.get("data") or {}).get("events") or []) if isinstance(api_payload.get("data"), Mapping) else []
            if events:
                rows_with_events += 1
                total_events += len(events)
            if stable_json_hash(strip_events(live_payload)) != stable_json_hash(strip_events(staging_payload)):
                non_events_diff.append(label)
            live_forecast = (live_payload.get("data") or {}).get("forecast") if isinstance(live_payload.get("data"), Mapping) else None
            staging_forecast = (
                (staging_payload.get("data") or {}).get("forecast") if isinstance(staging_payload.get("data"), Mapping) else None
            )
            if stable_json_hash(live_forecast) != stable_json_hash(staging_forecast):
                forecast_diff.append(label)
            if row["brand"] == "악템라":
                aktemra_live_levels.append(analysis_levels(live_payload))
                aktemra_staging_levels.append(analysis_levels(staging_payload))

        if contract_errors:
            raise CacheRefreshValidationError("contract errors: " + json.dumps(contract_errors[:20], ensure_ascii=False))
        if total_events <= 0:
            raise CacheRefreshValidationError("staging cache has zero events")
        if non_events_diff:
            raise CacheRefreshValidationError("non-events changed: " + json.dumps(non_events_diff[:20], ensure_ascii=False))
        if forecast_diff:
            raise CacheRefreshValidationError("forecast changed: " + json.dumps(forecast_diff[:20], ensure_ascii=False))
        if stable_json_hash(aktemra_live_levels) != stable_json_hash(aktemra_staging_levels):
            raise CacheRefreshValidationError("aktemra analysis_levels changed during events-only refresh")

        return ValidationSummary(
            live_rows=live_rows,
            staging_rows=staging_rows,
            rows_with_events=rows_with_events,
            total_events=total_events,
            non_events_diff_count=len(non_events_diff),
            forecast_diff_count=len(forecast_diff),
            contract_error_count=len(contract_errors),
            aktemra_analysis_levels_equal=True,
        )


    def connect_db() -> Any:
        return pymysql.connect(
            host=os.environ["MARIADB_HOST"],
            port=int(os.environ.get("MARIADB_PORT", "3306")),
            user=os.environ["MARIADB_USER"],
            password=os.environ["MARIADB_PASSWORD"],
            database=os.environ.get("MARIADB_DATABASE", "jw_mart"),
            charset="utf8mb4",
            autocommit=True,
            cursorclass=pymysql.cursors.DictCursor,
        )


    def parse_args() -> argparse.Namespace:
        parser = argparse.ArgumentParser(description="Validate cache_deep_analysis events-only staging without modifying live.")
        parser.add_argument("--live-table", default=os.environ.get("LIVE_TABLE", "cache_deep_analysis"))
        parser.add_argument("--staging-table", default=os.environ.get("STAGING_TABLE"))
        args = parser.parse_args()
        if not args.staging_table:
            raise CacheRefreshValidationError("--staging-table or STAGING_TABLE is required")
        return args


    def main() -> None:
        args = parse_args()
        conn = connect_db()
        try:
            summary = validate_tables(conn, args.live_table, args.staging_table)
            print(
                "CACHE_REFRESH_VALIDATE_JSON="
                + json.dumps({**summary.to_json(), "modified_live": False}, ensure_ascii=False)
            )
        finally:
            conn.close()


    if __name__ == "__main__":
        main()
  cache_deep_analysis_events_update.py: |
    from __future__ import annotations

    import argparse
    import hashlib
    import json
    import os
    import re
    import sys
    from collections.abc import Mapping
    from dataclasses import dataclass
    from pathlib import Path
    from typing import Any, Final

    import pymysql

    PROJECT_ROOT = Path(__file__).resolve().parents[3]
    if str(PROJECT_ROOT) not in sys.path:
        sys.path.insert(0, str(PROJECT_ROOT))
    SCRIPT_DIR = Path(__file__).resolve().parent
    if str(SCRIPT_DIR) not in sys.path:
        sys.path.insert(0, str(SCRIPT_DIR))
    for candidate in (Path("/app"), Path("/workspace")):
        etl_dir = candidate / "pipeline" / "scripts" / "etl"
        if etl_dir.exists():
            for path in (candidate, etl_dir):
                if str(path) not in sys.path:
                    sys.path.insert(0, str(path))
            break

    from cache_build_common import decode_json, dump_payload, payload_size
    from pipeline.scripts.etl.build_cache_deep_analysis import CANONICAL_25, _rebuild_events_for_brand


    TARGET_DATABASE: Final[str] = "jw_mart_d2_stage_20260630_r2"


    class CacheEventsUpdateError(RuntimeError):
        pass


    @dataclass(frozen=True, slots=True)
    class TableSummary:
        table: str
        rows: int
        payload_hash: str

        def to_json(self) -> dict[str, str | int]:
            return {"table": self.table, "rows": self.rows, "payload_hash": self.payload_hash}


    def quote_ident(name: str) -> str:
        if not re.fullmatch(r"[A-Za-z0-9_]+", name or ""):
            raise CacheEventsUpdateError(f"unsafe table name: {name!r}")
        return "`" + name.replace("`", "``") + "`"


    def stable_json_hash(value: Any) -> str:
        return hashlib.sha256(json.dumps(value, ensure_ascii=False, sort_keys=True, default=str).encode()).hexdigest()


    def connect_db() -> Any:
        database = os.environ.get("MARIADB_DATABASE", TARGET_DATABASE)
        if database != TARGET_DATABASE:
            raise CacheEventsUpdateError(f"refusing to write non-d2 database: {database}")
        user = os.environ.get("D2_WRITER_USER") or os.environ.get("MARIADB_USER")
        password = os.environ.get("D2_WRITER_PASSWORD") or os.environ.get("MARIADB_PASSWORD")
        if not user or not password:
            raise CacheEventsUpdateError("D2 writer credentials are required")
        return pymysql.connect(
            host=os.environ["MARIADB_HOST"],
            port=int(os.environ.get("MARIADB_PORT", "3306")),
            user=user,
            password=password,
            database=database,
            charset="utf8mb4",
            autocommit=False,
            cursorclass=pymysql.cursors.DictCursor,
        )


    def table_exists(conn: Any, table: str) -> bool:
        with conn.cursor() as cur:
            cur.execute(
                """
                SELECT COUNT(*) AS c
                FROM information_schema.tables
                WHERE table_schema = DATABASE() AND table_name = %s
                """,
                (table,),
            )
            return int(cur.fetchone()["c"]) == 1


    def require_tables(conn: Any, *tables: str) -> None:
        missing = [table for table in tables if not table_exists(conn, table)]
        if missing:
            raise CacheEventsUpdateError("missing required table(s): " + ", ".join(missing))


    def table_summary(conn: Any, table: str) -> TableSummary:
        digest = hashlib.sha256()
        rows = 0
        with conn.cursor() as cur:
            cur.execute(
                f"""
                SELECT brand, market_id, response_json, payload_size
                FROM {quote_ident(table)}
                ORDER BY brand, market_id
                """
            )
            for row in cur.fetchall():
                rows += 1
                digest.update(str(row["brand"]).encode())
                digest.update(b"\0")
                digest.update(str(row["market_id"]).encode())
                digest.update(b"\0")
                digest.update(str(row.get("payload_size")).encode())
                digest.update(b"\0")
                digest.update((row.get("response_json") or "").encode())
                digest.update(b"\n")
        return TableSummary(table=table, rows=rows, payload_hash=digest.hexdigest())


    def strip_events_from_raw(raw: str | None) -> dict[str, Any]:
        payload = decode_json(raw) or {}
        data = payload.get("data")
        if isinstance(data, dict):
            data = dict(data)
            data.pop("events", None)
            payload = dict(payload)
            payload["data"] = data
        return payload


    def get_events(payload: Mapping[str, Any]) -> list[Any]:
        data = payload.get("data")
        if not isinstance(data, Mapping):
            return []
        events = data.get("events")
        return events if isinstance(events, list) else []


    def max_event_date_for_brand(conn: Any, table: str, brand: str) -> str | None:
        max_date: str | None = None
        with conn.cursor() as cur:
            cur.execute(f"SELECT response_json FROM {quote_ident(table)} WHERE brand = %s", (brand,))
            for row in cur.fetchall():
                payload = decode_json(row.get("response_json")) or {}
                for event in get_events(payload):
                    if isinstance(event, Mapping):
                        date = event.get("date")
                        if isinstance(date, str) and (max_date is None or date > max_date):
                            max_date = date
        return max_date


    def build_staging(conn: Any, live_table: str, staging_table: str) -> dict[str, Any]:
        require_tables(conn, live_table, "events_raw")
        with conn.cursor() as cur:
            cur.execute(f"DROP TABLE IF EXISTS {quote_ident(staging_table)}")
            cur.execute(f"CREATE TABLE {quote_ident(staging_table)} LIKE {quote_ident(live_table)}")
            cur.execute(f"SELECT brand, market_id, response_json FROM {quote_ident(live_table)} ORDER BY brand, market_id")
            source_rows = list(cur.fetchall())

        columns = ("brand", "market_id", "response_json", "payload_size")
        sql = (
            f"INSERT INTO {quote_ident(staging_table)} "
            f"({', '.join(quote_ident(column) for column in columns)}) VALUES (%s, %s, %s, %s)"
        )
        batch: list[tuple[Any, ...]] = []
        rebuilt_rows = 0
        preserved_rows = 0
        total_events = 0
        rows_with_events = 0

        with conn.cursor() as cur:
            for row in source_rows:
                brand = str(row["brand"])
                payload = decode_json(row.get("response_json")) or {}
                data = payload.setdefault("data", {})
                if brand in CANONICAL_25:
                    data["events"] = _rebuild_events_for_brand(conn, brand)
                    rebuilt_rows += 1
                else:
                    preserved_rows += 1
                events = get_events(payload)
                if events:
                    rows_with_events += 1
                    total_events += len(events)
                encoded = dump_payload(payload)
                batch.append((brand, row.get("market_id"), encoded, payload_size(payload)))
                if len(batch) >= 50:
                    cur.executemany(sql, batch)
                    conn.commit()
                    batch = []
            if batch:
                cur.executemany(sql, batch)
                conn.commit()

        return {
            "live_table": live_table,
            "staging_table": staging_table,
            "source_rows": len(source_rows),
            "rebuilt_rows": rebuilt_rows,
            "preserved_rows": preserved_rows,
            "rows_with_events": rows_with_events,
            "total_events": total_events,
            "aktemra_max_event_date": max_event_date_for_brand(conn, staging_table, "악템라"),
        }


    def backup_live(conn: Any, live_table: str, backup_table: str) -> dict[str, Any]:
        require_tables(conn, live_table)
        with conn.cursor() as cur:
            cur.execute(f"DROP TABLE IF EXISTS {quote_ident(backup_table)}")
            cur.execute(f"CREATE TABLE {quote_ident(backup_table)} LIKE {quote_ident(live_table)}")
            cur.execute(f"INSERT INTO {quote_ident(backup_table)} SELECT * FROM {quote_ident(live_table)}")
            conn.commit()
        return {"backup": table_summary(conn, backup_table).to_json()}


    def assert_same_keyset(conn: Any, left_table: str, right_table: str) -> None:
        with conn.cursor() as cur:
            cur.execute(
                f"""
                SELECT COUNT(*) AS c
                FROM {quote_ident(left_table)} l
                LEFT JOIN {quote_ident(right_table)} r USING (brand, market_id)
                WHERE r.brand IS NULL
                """
            )
            left_missing = int(cur.fetchone()["c"])
            cur.execute(
                f"""
                SELECT COUNT(*) AS c
                FROM {quote_ident(right_table)} r
                LEFT JOIN {quote_ident(left_table)} l USING (brand, market_id)
                WHERE l.brand IS NULL
                """
            )
            right_missing = int(cur.fetchone()["c"])
        if left_missing or right_missing:
            raise CacheEventsUpdateError(
                f"table keyset mismatch: {left_table}-only={left_missing}, {right_table}-only={right_missing}"
            )


    def apply_events_update(conn: Any, live_table: str, staging_table: str) -> dict[str, Any]:
        require_tables(conn, live_table, staging_table)
        assert_same_keyset(conn, live_table, staging_table)
        before = table_summary(conn, live_table)
        with conn.cursor() as cur:
            cur.execute(
                f"""
                UPDATE {quote_ident(live_table)} live
                JOIN {quote_ident(staging_table)} staging USING (brand, market_id)
                SET live.response_json = staging.response_json,
                    live.payload_size = staging.payload_size
                """
            )
            updated = cur.rowcount
            conn.commit()
        after = table_summary(conn, live_table)
        return {"before": before.to_json(), "after": after.to_json(), "updated_rows": updated}


    def verify_after_update(conn: Any, live_table: str, backup_table: str) -> dict[str, Any]:
        require_tables(conn, live_table, backup_table)
        assert_same_keyset(conn, live_table, backup_table)
        with conn.cursor() as cur:
            cur.execute(
                f"""
                SELECT live.brand, live.market_id, live.response_json AS live_json, backup.response_json AS backup_json
                FROM {quote_ident(live_table)} live
                JOIN {quote_ident(backup_table)} backup USING (brand, market_id)
                ORDER BY live.brand, live.market_id
                """
            )
            rows = list(cur.fetchall())

        non_events_diff = 0
        events_changed = 0
        rows_with_events = 0
        total_events = 0
        for row in rows:
            live_raw = row.get("live_json")
            backup_raw = row.get("backup_json")
            live_payload = decode_json(live_raw) or {}
            backup_payload = decode_json(backup_raw) or {}
            if stable_json_hash(strip_events_from_raw(live_raw)) != stable_json_hash(strip_events_from_raw(backup_raw)):
                non_events_diff += 1
            if stable_json_hash(get_events(live_payload)) != stable_json_hash(get_events(backup_payload)):
                events_changed += 1
            events = get_events(live_payload)
            if events:
                rows_with_events += 1
                total_events += len(events)
        if non_events_diff:
            raise CacheEventsUpdateError(f"non-events changed after update: {non_events_diff}")
        return {
            "rows_checked": len(rows),
            "non_events_diff_count": non_events_diff,
            "events_changed_rows": events_changed,
            "rows_with_events": rows_with_events,
            "total_events": total_events,
            "aktemra_max_event_date": max_event_date_for_brand(conn, live_table, "악템라"),
        }


    def drop_table(conn: Any, table: str) -> dict[str, Any]:
        with conn.cursor() as cur:
            cur.execute(f"DROP TABLE IF EXISTS {quote_ident(table)}")
            conn.commit()
        return {"dropped_table": table, "exists_after_drop": table_exists(conn, table)}


    def parse_args() -> argparse.Namespace:
        parser = argparse.ArgumentParser(description="Update d2 cache_deep_analysis events with full row coverage preserved.")
        parser.add_argument("--live-table", default=os.environ.get("LIVE_TABLE", "cache_deep_analysis"))
        parser.add_argument("--staging-table", default=os.environ.get("STAGING_TABLE"))
        parser.add_argument("--backup-table", default=os.environ.get("BACKUP_TABLE"))
        parser.add_argument("--build-staging", action="store_true")
        parser.add_argument("--backup-live", action="store_true")
        parser.add_argument("--apply-update", action="store_true")
        parser.add_argument("--post-verify", action="store_true")
        parser.add_argument("--drop-staging", action="store_true")
        args = parser.parse_args()
        if (args.build_staging or args.apply_update or args.drop_staging) and not args.staging_table:
            raise CacheEventsUpdateError("--staging-table or STAGING_TABLE is required")
        if (args.backup_live or args.post_verify) and not args.backup_table:
            raise CacheEventsUpdateError("--backup-table or BACKUP_TABLE is required")
        if not any((args.build_staging, args.backup_live, args.apply_update, args.post_verify, args.drop_staging)):
            raise CacheEventsUpdateError("at least one action is required")
        return args


    def main() -> None:
        args = parse_args()
        conn = connect_db()
        summary: dict[str, Any] = {"database": os.environ.get("MARIADB_DATABASE", TARGET_DATABASE)}
        try:
            if args.build_staging:
                summary["build_staging"] = build_staging(conn, args.live_table, args.staging_table)
                summary["staging"] = table_summary(conn, args.staging_table).to_json()
            if args.backup_live:
                summary["backup_live"] = backup_live(conn, args.live_table, args.backup_table)
            if args.apply_update:
                summary["apply_update"] = apply_events_update(conn, args.live_table, args.staging_table)
            if args.post_verify:
                summary["post_verify"] = verify_after_update(conn, args.live_table, args.backup_table)
            if args.drop_staging:
                summary["drop_staging"] = drop_table(conn, args.staging_table)
            print("CACHE_EVENTS_UPDATE_JSON=" + json.dumps(summary, ensure_ascii=False, default=str))
        finally:
            conn.close()


    if __name__ == "__main__":
        main()
