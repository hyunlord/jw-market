apiVersion: batch/v1
kind: CronJob
metadata:
  name: jw-cache-refresh-daily
  namespace: llmops
  labels:
    app: jw-cache-refresh
    component: cache-deep-analysis
spec:
  schedule: "0 20 * * *" # 05:00 KST, after Tier1/Tier2 crawl windows
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: jw-cache-refresh
            component: cache-deep-analysis
          annotations:
            sidecar.istio.io/inject: "false"
        spec:
          restartPolicy: Never
          nodeSelector:
            genos: "enabled"
          containers:
            - name: cache-refresh
              image: asia-northeast3-docker.pkg.dev/prj-jw-agn-stg-ai/ar-jw-agn-stg-genos-dev-01/jw-market-backend-api:v0.9.54-unified-ec5d6f5d-20260704
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: "200m"
                  memory: "512Mi"
                limits:
                  cpu: "1"
                  memory: "2Gi"
              env:
                - name: MARIADB_HOST
                  value: llmops-mariadb-service.llmops.svc.cluster.local
                - name: MARIADB_PORT
                  value: "3306"
                - name: MARIADB_USER
                  value: llmops
                - name: MARIADB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: galera-mariadb-galera
                      key: mariadb-password
                - name: MARIADB_DATABASE
                  value: jw_mart
              volumeMounts:
                - name: cache-refresh-validator
                  mountPath: /opt/cache-refresh
                  readOnly: true
              command: ["/bin/bash", "-lc"]
              args:
                - |
                  set -euo pipefail

                  RUN_ID="$(date -u +%Y%m%d%H%M%S)"
                  LIVE_TABLE="cache_deep_analysis"
                  STAGING_TABLE="cache_deep_analysis_events_staging"
                  BACKUP_TABLE="cache_deep_analysis_events_backup_${RUN_ID}"
                  export LIVE_TABLE STAGING_TABLE BACKUP_TABLE RUN_ID

                  if [ -f /app/pipeline/scripts/etl/build_cache_deep_analysis.py ]; then
                    cd /app
                  elif [ -f /workspace/pipeline/scripts/etl/build_cache_deep_analysis.py ]; then
                    cd /workspace
                  elif [ -f pipeline/scripts/etl/build_cache_deep_analysis.py ]; then
                    :
                  else
                    echo "ABORT: build_cache_deep_analysis.py not found in image"
                    exit 20
                  fi

                  echo "CACHE_REFRESH_START run_id=${RUN_ID} target=${STAGING_TABLE}"
                  python pipeline/scripts/etl/build_cache_deep_analysis.py \
                    --events-only \
                    --target-table "${STAGING_TABLE}" \
                    --verbose

                  python /opt/cache-refresh/cache_deep_analysis_refresh_validate.py \
                    --live-table "${LIVE_TABLE}" \
                    --staging-table "${STAGING_TABLE}" \
                    --backup-table "${BACKUP_TABLE}" \
                    --swap

                  echo "CACHE_REFRESH_DONE run_id=${RUN_ID}"
          volumes:
            - name: cache-refresh-validator
              configMap:
                name: cache-refresh-validator
