# Canonical suspended template for an isolated R-1 full-pipeline rehearsal.
# Copy this manifest, give the Job a unique name, set image to the pinned digest,
# replace both isolated database placeholders, and set spec.suspend=false only after
# recording the input pins.
# Isolated DB naming (rehearse-full contract): R1_TARGET_DB=jw_mart_rehearsal_r1_<date>,
# R1_CACHE_DB=jw_mart_s6_rehearsal_r1_<date> (jw_mart / *_r2 are PROTECTED). Pre-create
# both with root before unsuspend (the d2-writer cannot CREATE DATABASE).
# Source = local/NFS (--source-backend local); no MinIO ingest (PL: MinIO=archive).
#
# Log durability: every run writes under /work/evidence/${R1_RUN_ID}, and
# /work/evidence is backed by the r1-evidence-nfs RWX PVC (NOT the emptyDir), so
# the log + evidence survive pod loss. Pre-apply the PVC manifest
# (pipeline-orchestrator-r1-evidence-pvc.yaml). The orchestrator prints
# `[stage] <key> start|end rc=` markers, so the failing step is identifiable from
# the last line even on a silent kill. ttlSecondsAfterFinished keeps the failed
# pod for 24h so its logs are not GC'd before inspection.
# ★ node scheduling: R-1 needs the NFS-capable pool. nodeSelector pins
# knp-jw-agn-dev-genos-api-01 (db-02 pool nodes cannot mount the Filestore).
apiVersion: batch/v1
kind: Job
metadata:
  name: jw-pipeline-full-rehearsal-template
  namespace: llmops
  labels:
    app: jw-pipeline-r1-rehearsal
    codex-owner: latency-goal
spec:
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 43200
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: jw-pipeline-r1-rehearsal
        codex-owner: latency-goal
      annotations:
        # A full rehearsal can outlive an autoscaler observation window. Losing
        # the pod discards its emptyDir and cannot be resumed safely.
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-nodepool: knp-jw-agn-dev-genos-api-01
      securityContext:
        fsGroup: 3000
      containers:
        - name: rehearsal
          image: asia-northeast3-docker.pkg.dev/prj-jw-agn-stg-ai/ar-jw-agn-stg-genos-dev-01/jw-pipeline-orchestrator:REPLACE_WITH_PINNED_DIGEST
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              umask 077
              cd /app
              R1_LOCK_DIR="/work/evidence/.r1-active-lock"
              if ! mkdir "${R1_LOCK_DIR}"; then
                echo "error: another R-1 run owns the durable lock" >&2
                exit 75
              fi
              cleanup_r1_lock() {
                if test -d "${R1_LOCK_DIR}"; then
                  rmdir "${R1_LOCK_DIR}"
                fi
              }
              trap cleanup_r1_lock EXIT
              EVIDENCE_DIR="/work/evidence/${R1_RUN_ID}"
              mkdir "${EVIDENCE_DIR}"
              test "${R1_TARGET_DB}" != "REPLACE_WITH_NEW_ISOLATED_DB"
              test "${R1_CACHE_DB}" != "REPLACE_WITH_NEW_ISOLATED_CACHE_DB"
              test "${R1_SOURCE_SUBPATH}" != "REPLACE_WITH_PINNED_SOURCE_SUBPATH"
              test "${R1_RUN_ID}" != "REPLACE_WITH_UNIQUE_RUN_ID"
              # Tee the whole pipeline to the durable evidence PVC so the log
              # survives pod loss. pipefail propagates any stage failure to the
              # Job exit code (tee returns 0).
              {
                echo "[job] start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                python -m pipeline.orchestrator materialize-full-inputs \
                  --output-root /work/inputs \
                  --source-backend local \
                  --ubist-source-dir /r1-source/UBIST \
                  --iqvia-source-dir /r1-source/IQVIA \
                  --ubist-parquet-sidecar \
                    /canonical-ubist/f046-c927ac9d/raw/ubist/year=2026/month=05/data.parquet \
                    year=2026/month=05/data.parquet \
                    8798ff1e04f524d59bcdddf42bc4f14f18ffe68b91942d3de970faadec6e2a5c
                cp /work/inputs/input_manifest.json "${EVIDENCE_DIR}/"
                cp /work/inputs/input_inventory.json "${EVIDENCE_DIR}/"
                python -m pipeline.orchestrator preflight-full \
                  --input-manifest /work/inputs/input_manifest.json \
                  --input-inventory /work/inputs/input_inventory.json \
                  --target-db "${R1_TARGET_DB}" \
                  --cache-db "${R1_CACHE_DB}" \
                  --source-db "${R1_SOURCE_DB}" \
                  --work-dir /work/rehearsal \
                  --evidence-dir "${EVIDENCE_DIR}" \
                  --job-manifest /app/deploy/k8s/orchestrator/pipeline-orchestrator-full-rehearsal-job.yaml \
                  --repo-root /app \
                  --output "${EVIDENCE_DIR}/preflight.json"
                python -m pipeline.orchestrator rehearse-full \
                  --input-manifest /work/inputs/input_manifest.json \
                  --target-db "${R1_TARGET_DB}" \
                  --cache-db "${R1_CACHE_DB}" \
                  --source-db "${R1_SOURCE_DB}" \
                  --work-dir /work/rehearsal
                python -m pipeline.orchestrator compare-full \
                  --reference-db "${R1_SOURCE_DB}" \
                  --target-db "${R1_TARGET_DB}" \
                  --reference-cache-db "${R1_SOURCE_DB}" \
                  --target-cache-db "${R1_CACHE_DB}" \
                  --output "${EVIDENCE_DIR}/r1_compare.json"
                cat "${EVIDENCE_DIR}/r1_compare.json"
                echo "[job] complete $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              } 2>&1 | tee "${EVIDENCE_DIR}/rehearse.log"
          env:
            - name: R1_RUN_ID
              value: REPLACE_WITH_UNIQUE_RUN_ID
            - name: R1_SOURCE_SUBPATH
              value: REPLACE_WITH_PINNED_SOURCE_SUBPATH
            - name: R1_IMAGE_DIGEST
              value: REPLACE_WITH_PINNED_DIGEST
            - name: R1_GIT_COMMIT
              value: REPLACE_WITH_GIT_COMMIT
            - name: R1_TARGET_DB
              value: REPLACE_WITH_NEW_ISOLATED_DB
            - name: R1_CACHE_DB
              value: REPLACE_WITH_NEW_ISOLATED_CACHE_DB
            - name: R1_SOURCE_DB
              value: jw_mart_d2_stage_20260630_r2
            # MinIO env intentionally removed: R-1 source is local/NFS (MinIO=archive).
            - name: MARIADB_HOST
              value: llmops-mariadb-service.llmops.svc.cluster.local
            - name: MARIADB_PORT
              value: "3306"
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef: &db_user
                  name: jw-mart-d2-writer
                  key: username
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef: &db_password
                  name: jw-mart-d2-writer
                  key: password
            - name: CACHE_MARIADB_USER
              valueFrom:
                secretKeyRef: *db_user
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef: *db_password
            - name: DB_HOST
              value: llmops-mariadb-service.llmops.svc.cluster.local
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              valueFrom:
                secretKeyRef: *db_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: *db_password
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              ephemeral-storage: 20Gi
            limits:
              cpu: "4"
              memory: 16Gi
              ephemeral-storage: 50Gi
          volumeMounts:
            - name: work
              mountPath: /work
            - name: evidence
              mountPath: /work/evidence
            - name: r1-source
              mountPath: /r1-source
              subPathExpr: $(R1_SOURCE_SUBPATH)
              readOnly: true
            - name: canonical-ubist
              mountPath: /canonical-ubist
              readOnly: true
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 50Gi
        # Durable evidence subtree (RWX nfs-client) — survives pod loss so the
        # teed rehearse.log and compare output are recoverable after a failure.
        - name: evidence
          persistentVolumeClaim:
            claimName: r1-evidence-nfs
        # Canonical R-1 source = local/NFS tree (PL: 인입 정본=NFS/local, MinIO=archive).
        # Before unsuspend: stage /home/GCP/jw-market/data/{UBIST,IQVIA} onto this
        # nfs-client PVC (RWX, same Filestore backend as the ingest hook's
        # llmops-nfs-root), then mount RO here as /r1-source/{UBIST,IQVIA}.
        - name: r1-source
          persistentVolumeClaim:
            claimName: r1-source-nfs
            readOnly: true
        - name: canonical-ubist
          persistentVolumeClaim:
            claimName: codespace-volume-19
            readOnly: true
