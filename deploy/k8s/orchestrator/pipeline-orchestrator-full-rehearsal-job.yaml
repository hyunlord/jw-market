# Canonical suspended template for an isolated R-1 full-pipeline rehearsal.
# Copy this manifest, give the Job a unique name, set image to the v0.2.9 digest,
# replace both isolated database placeholders, and set spec.suspend=false only after
# recording the input pins.
# Isolated DB naming (rehearse-full contract): R1_TARGET_DB=jw_mart_rehearsal_r1_<date>,
# R1_CACHE_DB=jw_mart_s6_rehearsal_r1_<date> (jw_mart / *_r2 are PROTECTED). Pre-create
# both with root before unsuspend (the d2-writer cannot CREATE DATABASE).
# Source = local/NFS (--source-backend local); no MinIO ingest (PL: MinIO=archive).
apiVersion: batch/v1
kind: Job
metadata:
  name: jw-pipeline-full-rehearsal-template
  namespace: llmops
  labels:
    app: jw-pipeline-r1-rehearsal
    codex-owner: latency-goal
spec:
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  template:
    metadata:
      labels:
        app: jw-pipeline-r1-rehearsal
        codex-owner: latency-goal
      annotations:
        # A full rehearsal can outlive an autoscaler observation window. Losing
        # the pod discards its emptyDir and cannot be resumed safely.
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 3000
      containers:
        - name: rehearsal
          image: asia-northeast3-docker.pkg.dev/prj-jw-agn-stg-ai/ar-jw-agn-stg-genos-dev-01/jw-pipeline-orchestrator@sha256:2e7943ca232ffe8d040df22297dec791595e62222e60200311408c8d7f0520ae
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              umask 077
              cd /app
              mkdir -p /work/evidence
              test "${R1_TARGET_DB}" != "REPLACE_WITH_NEW_ISOLATED_DB"
              test "${R1_CACHE_DB}" != "REPLACE_WITH_NEW_ISOLATED_CACHE_DB"
              python -m pipeline.orchestrator materialize-full-inputs \
                --output-root /work/inputs \
                --source-backend local \
                --ubist-source-dir /r1-source/UBIST \
                --iqvia-source-dir /r1-source/IQVIA \
                --ubist-parquet-sidecar \
                  /canonical-ubist/f046-c927ac9d/raw/ubist/year=2026/month=05/data.parquet \
                  year=2026/month=05/data.parquet \
                  8798ff1e04f524d59bcdddf42bc4f14f18ffe68b91942d3de970faadec6e2a5c
              cp /work/inputs/input_manifest.json /work/evidence/
              cp /work/inputs/input_inventory.json /work/evidence/
              python -m pipeline.orchestrator rehearse-full \
                --input-manifest /work/inputs/input_manifest.json \
                --target-db "${R1_TARGET_DB}" \
                --cache-db "${R1_CACHE_DB}" \
                --source-db "${R1_SOURCE_DB}" \
                --work-dir /work/rehearsal
              python -m pipeline.orchestrator compare-full \
                --reference-db "${R1_SOURCE_DB}" \
                --target-db "${R1_TARGET_DB}" \
                --reference-cache-db "${R1_SOURCE_DB}" \
                --target-cache-db "${R1_CACHE_DB}" \
                --output /work/evidence/r1_compare.json
              cat /work/evidence/r1_compare.json
          env:
            - name: R1_TARGET_DB
              value: REPLACE_WITH_NEW_ISOLATED_DB
            - name: R1_CACHE_DB
              value: REPLACE_WITH_NEW_ISOLATED_CACHE_DB
            - name: R1_SOURCE_DB
              value: jw_mart_d2_stage_20260630_r2
            # MinIO env intentionally removed: R-1 source is local/NFS (MinIO=archive).
            - name: MARIADB_HOST
              value: llmops-mariadb-service.llmops.svc.cluster.local
            - name: MARIADB_PORT
              value: "3306"
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef: &db_user
                  name: jw-mart-d2-writer
                  key: username
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef: &db_password
                  name: jw-mart-d2-writer
                  key: password
            - name: CACHE_MARIADB_USER
              valueFrom:
                secretKeyRef: *db_user
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef: *db_password
            - name: DB_HOST
              value: llmops-mariadb-service.llmops.svc.cluster.local
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              valueFrom:
                secretKeyRef: *db_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: *db_password
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              ephemeral-storage: 20Gi
            limits:
              cpu: "4"
              memory: 16Gi
              ephemeral-storage: 50Gi
          volumeMounts:
            - name: work
              mountPath: /work
            - name: r1-source
              mountPath: /r1-source
              readOnly: true
            - name: canonical-ubist
              mountPath: /canonical-ubist
              readOnly: true
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 50Gi
        # Canonical R-1 source = local/NFS tree (PL: 인입 정본=NFS/local, MinIO=archive).
        # Before unsuspend: stage /home/GCP/jw-market/data/{UBIST,IQVIA} onto this
        # nfs-client PVC (RWX, same Filestore backend as the ingest hook's
        # llmops-nfs-root), then mount RO here as /r1-source/{UBIST,IQVIA}.
        - name: r1-source
          persistentVolumeClaim:
            claimName: r1-source-nfs
            readOnly: true
        - name: canonical-ubist
          persistentVolumeClaim:
            claimName: codespace-volume-19
            readOnly: true
